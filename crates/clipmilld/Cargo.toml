[package]
name = "clipmilld"
description = "The ClipMill daemon: single writer, scheduler, artifact store, IPC gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
clap.workspace = true
clipmill-artifacts.workspace = true
clipmill-captions.workspace = true
clipmill-contracts.workspace = true
clipmill-director.workspace = true
clipmill-core.workspace = true
clipmill-discovery.workspace = true
clipmill-edit-ir.workspace = true
clipmill-editorial.workspace = true
clipmill-evidence.workspace = true
clipmill-export.workspace = true
clipmill-hub.workspace = true
clipmill-reframe.workspace = true
clipmill-render.workspace = true
clipmill-youtube.workspace = true
directories.workspace = true
ed25519-dalek.workspace = true
fs2.workspace = true
getrandom.workspace = true
humantime.workspace = true
nix.workspace = true
hex.workspace = true
hmac.workspace = true
prost.workspace = true
# The release check. The same client and TLS stack the hub and YouTube crates
# already build, so nothing new enters the lock file.
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider"] }
rusqlite.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
serde_json_canonicalizer.workspace = true
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["fs"] }
tracing.workspace = true
tracing-subscriber.workspace = true
ulid.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
mmap-io.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
memfd.workspace = true

[target.'cfg(windows)'.dependencies]
winapi-util = "0.1.11"

[dev-dependencies]
clipmill-edit-ir.workspace = true
clipmill-reframe.workspace = true
clipmill-render.workspace = true
tempfile = "3.23"

[lints]
workspace = true
