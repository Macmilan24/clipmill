[project]
name = "clipmill-youtube-import"
version = "0.1.0"
description = "Explicit single-video YouTube acquisition for ClipMill"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = ["yt-dlp==2026.8.19", "yt-dlp-ejs==0.8.0", "certifi>=2026.7.22"]

[project.scripts]
clipmill-youtube-import = "clipmill_youtube_import:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clipmill_youtube_import"]
