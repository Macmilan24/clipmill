[project]
name = "clipmill-eval-harness"
version = "0.0.1"
description = "Evaluation harness: corpus fetch/verify by sha256, stage runner, run-manifest recorder"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clipmill_eval"]
