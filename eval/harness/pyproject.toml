[project]
name = "clipmill-eval-harness"
version = "0.0.1"
description = "Evaluation harness: corpus fetch/verify by sha256, stage runner, run-manifest recorder"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = ["clipmill-worker-sdk", "cryptography>=45", "protobuf>=5.29"]

[project.scripts]
clipmill-eval = "clipmill_eval.cli:main"

[tool.uv.sources]
clipmill-worker-sdk = { path = "../../workers/sdk", editable = true }

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clipmill_eval"]
