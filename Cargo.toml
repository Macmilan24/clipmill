[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/Macmilan24/clipmill"
authors = ["Samuel Dagne <cpt.macmilan24@gmail.com>"]

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "warn"
dbg_macro = "warn"
# pedantic opt-outs that fight readability more than they help
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"

[workspace.dependencies]
clipmill-artifacts = { path = "crates/clipmill-artifacts", version = "0.0.1" }
clipmill-core = { path = "crates/clipmill-core", version = "0.0.1" }
clipmill-discovery = { path = "crates/clipmill-discovery", version = "0.0.1" }
clipmill-edit-ir = { path = "crates/clipmill-edit-ir", version = "0.0.1" }
clipmill-evidence = { path = "crates/clipmill-evidence", version = "0.0.1" }
clipmill-reframe = { path = "crates/clipmill-reframe", version = "0.0.1" }
clipmill-render = { path = "crates/clipmill-render", version = "0.0.1" }
clipmill-contracts = { path = "crates/clipmill-contracts", version = "0.0.1" }
clipmilld = { path = "crates/clipmilld", version = "0.0.1" }
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
ed25519-dalek = "2.2.0"
fs2 = "0.4"
getrandom = "0.4"
hex = "0.4.3"
humantime = "2.4.0"
memfd = "0.6.5"
mmap-io = { version = "1.0.0", default-features = false }
nix = { version = "0.31.3", features = ["fs", "mman", "socket", "uio"] }
prost = "0.14"
rusqlite = { version = "0.40.1", features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
# `float_roundtrip` because the default parser is not exact: it reads
# 0.9299999999999999 as the double nearest 0.93, so a float published in an
# artifact and read back by the daemon is a different number from the one that
# was written. Python and JavaScript both parse exactly, which means without
# this the three languages disagree about documents they all validate — and a
# canonical round-trip in Rust silently rewrites values it was meant to
# preserve.
serde_json = { version = "1", features = ["float_roundtrip"] }
serde_json_canonicalizer = "0.3.2"
sha2 = "0.11"
thiserror = "2"
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
tokio = { version = "1.49", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ulid = "1.2"
