[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/Macmilan24/clipmill"
authors = ["Samuel Dagne <cpt.macmilan24@gmail.com>"]

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "warn"
dbg_macro = "warn"
# pedantic opt-outs that fight readability more than they help
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"

[workspace.dependencies]
clipmill-artifacts = { path = "crates/clipmill-artifacts", version = "0.0.1" }
clipmill-core = { path = "crates/clipmill-core", version = "0.0.1" }
clipmill-contracts = { path = "crates/clipmill-contracts", version = "0.0.1" }
clipmilld = { path = "crates/clipmilld", version = "0.0.1" }
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
ed25519-dalek = "2.2.0"
fs2 = "0.4"
getrandom = "0.3"
hex = "0.4.3"
humantime = "2.4.0"
memfd = "0.6.5"
mmap-io = { version = "1.0.0", default-features = false }
nix = { version = "0.31.3", features = ["fs", "mman", "socket", "uio"] }
prost = "0.14"
rusqlite = { version = "0.40.1", features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.3.2"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1.49", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ulid = "1.2"
