[project]
name = "clipmill-worker-sdk"
version = "0.0.1"
description = "ClipMill worker protocol client: capability handshake, leases, heartbeats, generated contract types"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
  # CVE-2026-69247, fixed in 50.0.0. This is the floor every Python environment
  # in the repository inherits: each of the other eleven lockfiles reaches
  # cryptography through this package, so raising it here is what moves them.
  "cryptography>=50",
  "protobuf>=5.29",
  "pyarrow>=18",
  "pydantic>=2.7",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The generated protobuf modules import each other via the proto package path
# ("clipmill.time.v1"), so buf writes them to src/clipmill/ — shipped as a
# top-level package alongside the SDK itself.
packages = ["src/clipmill_worker_sdk", "src/clipmill"]
