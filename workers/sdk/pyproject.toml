[project]
name = "clipmill-worker-sdk"
version = "0.0.1"
description = "ClipMill worker protocol client: capability handshake, leases, heartbeats, generated contract types"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clipmill_worker_sdk"]
