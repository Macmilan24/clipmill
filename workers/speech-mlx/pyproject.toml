[project]
name = "clipmill-worker-speech-mlx"
version = "0.1.0"
description = "Qwen3-ASR and Qwen3-ForcedAligner on MLX: the accelerated speech path, behind the same contracts as the portable one"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
  "clipmill-worker-sdk",
  "numpy>=2",
  # MLX exists only on Apple silicon. The marker is what lets one lockfile
  # describe both platforms: on Linux this resolves to nothing at all, and the
  # worker refuses to start rather than importing something that is not there.
  "mlx-audio==0.4.6; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.scripts]
clipmill-worker-speech-mlx = "clipmill_worker_speech_mlx:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
clipmill-worker-sdk = { path = "../sdk", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clipmill_worker_speech_mlx"]
