[project]
name = "clipmill-worker-vad"
version = "0.1.0"
description = "Voice activity detection (silero-VAD on onnxruntime): where speech is, before anything transcribes it"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
  "clipmill-worker-sdk",
  "numpy>=2",
  "onnxruntime>=1.20",
]

[project.scripts]
clipmill-worker-vad = "clipmill_worker_vad:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
clipmill-worker-sdk = { path = "../sdk", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clipmill_worker_vad"]
