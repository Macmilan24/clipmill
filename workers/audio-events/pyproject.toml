[project]
name = "clipmill-worker-audio-events"
version = "0.1.0"
description = "Audio events (CED-mini on onnxruntime): laughter, applause, cheering, music, shouting and gasps"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
  "clipmill-worker-sdk",
  "numpy>=2",
  "onnxruntime>=1.20",
]

[project.scripts]
clipmill-worker-audio-events = "clipmill_worker_audio_events:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
clipmill-worker-sdk = { path = "../sdk", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clipmill_worker_audio_events"]
