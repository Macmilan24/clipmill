[project]
name = "clipmill-worker-asr-whispercpp"
version = "0.1.0"
description = "Recognition on the universal fallback path (whisper.cpp): runs on any machine, which is what the offline exit gate rests on"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
  "clipmill-worker-sdk",
  "numpy>=2",
  "pywhispercpp>=1.5",
]

[project.scripts]
clipmill-worker-asr = "clipmill_worker_asr_whispercpp:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
clipmill-worker-sdk = { path = "../sdk", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clipmill_worker_asr_whispercpp"]
