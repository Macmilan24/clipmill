[project]
name = "clipmill-worker-shots"
version = "0.1.0"
description = "Shot detection (PySceneDetect's content detector over the pinned proxy decode): where the camera changed"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
  "clipmill-worker-sdk",
  "numpy>=2",
  "scenedetect>=0.7,<0.8",
]

[project.scripts]
clipmill-worker-shots = "clipmill_worker_shots:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
clipmill-worker-sdk = { path = "../sdk", editable = true }

# OpenCV arrives through PySceneDetect, which asks for the desktop
# `opencv-python` wheel rather than the headless one. Swapping it for
# `opencv-python-headless` under a uv override works locally and breaks the
# supply-chain audit: pip does not read uv's overrides, so it re-resolves
# scenedetect's own requirement and finds a package the exported lockfile does
# not pin. A worker whose dependencies cannot be audited is a worse trade than
# a wheel carrying window bindings nobody calls, so the declared dependency is
# taken as declared and Linux CI installs the GL library its import needs.
#
# Nothing here imports cv2 directly. Only the detector does, and only for
# colour conversion and channel splitting — never for video I/O, which stays
# with the pinned FFmpeg the daemon hands us on the lease.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clipmill_worker_shots"]
