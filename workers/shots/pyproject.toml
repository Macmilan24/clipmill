[project]
name = "clipmill-worker-shots"
version = "0.1.0"
description = "Shot detection (PySceneDetect's content detector over the pinned proxy decode): where the camera changed"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
  "clipmill-worker-sdk",
  "numpy>=2",
  "opencv-python-headless>=4.10",
  "scenedetect>=0.7,<0.8",
]

[project.scripts]
clipmill-worker-shots = "clipmill_worker_shots:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
clipmill-worker-sdk = { path = "../sdk", editable = true }

[tool.uv]
# PySceneDetect asks for `opencv-python`, whose wheel carries a GUI stack this
# worker never opens and which needs libGL present merely to import — so on a
# headless Linux machine the desktop build fails at `import cv2` before doing
# any work. The marker below drops that requirement and the direct dependency
# above supplies the same OpenCV without the window bindings. Only the array
# operations are used: colour conversion and channel splitting, never video
# I/O, which stays with the pinned FFmpeg the daemon hands us.
override-dependencies = ["opencv-python; sys_platform == 'nonesuch'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clipmill_worker_shots"]
