[project]
name = "clipmill-worker-echo"
version = "0.0.1"
description = "The null worker: exercises lease/heartbeat/complete/decline without doing work"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = ["clipmill-worker-sdk"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
clipmill-worker-sdk = { path = "../sdk", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clipmill_worker_echo"]
