packages:
  - packages/*
  - apps/desktop
allowBuilds:
  # Vite's bundler. Its install script links the platform-native binary, which
  # the shell cannot be built without. Reviewed and allowed deliberately: it is
  # the only package in the tree permitted to run install scripts.
  esbuild: true
overrides:
  # Two host-confusion advisories in the same parser, a patch apart:
  # GHSA-v2hh-gcrm-f6hx (a literal IPv6 authority) and GHSA-7p8r-x3mc-p8w7 (a
  # backslash), the second of which is fixed only in 3.1.5. Reached
  # transitively through ajv, which still resolves the vulnerable 3.1.3.
  #
  # Pinned to the patch rather than an open range: `>=3.1.5` resolves to 4.x,
  # a semver-major move inside the JSON Schema validator the contract fixtures
  # depend on. Drop this once ajv widens its own range.
  fast-uri@<3.1.5: '3.1.5'
