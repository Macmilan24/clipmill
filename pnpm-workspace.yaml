packages:
  - packages/*
  - apps/desktop
allowBuilds:
  # Vite's bundler. Its install script links the platform-native binary, which
  # the shell cannot be built without. Reviewed and allowed deliberately: it is
  # the only package in the tree permitted to run install scripts.
  esbuild: true
overrides:
  # Six advisories in the same URI parser, a patch apart each time:
  # GHSA-v2hh-gcrm-f6hx and GHSA-7p8r-x3mc-p8w7 (host confusion) closed in
  # 3.1.5; GHSA-5jgf-p345-68v8, GHSA-f65p-4m7j-42xc, GHSA-fph4-wmhf-6fwf and
  # GHSA-jqff-g426-hqxp (host confusion and SSRF via normalization) closed in
  # 3.1.6. Reached transitively through ajv, which still resolves 3.1.3.
  #
  # Pinned to the patch rather than an open range: `>=3.1.6` resolves to 4.x,
  # a semver-major move inside the JSON Schema validator the contract fixtures
  # depend on. Drop this once ajv widens its own range.
  fast-uri@<3.1.6: '3.1.6'
