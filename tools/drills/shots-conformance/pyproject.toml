[project]
name = "clipmill-shots-conformance"
version = "0.1.0"
description = "Runs shot detection over a fixture whose cuts are known by construction"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
# The shots worker installed on its own, for the same reason the speech gate has
# an environment of its own: a drill run inside a worker's environment would be
# a worker testing itself with its own dev dependencies in scope.
dependencies = ["clipmill-worker-shots"]

[tool.uv.sources]
clipmill-worker-shots = { path = "../../../workers/shots", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
