[project]
name = "clipmill-speech-conformance"
version = "0.1.0"
description = "Runs the whole speech chain over a fixture whose word timing is known by construction"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
# The one place all three speech workers are installed together. They ship as
# separate environments on purpose — the accelerated primary is macOS-only and
# the runtimes have different dependency tails — so the gate that exercises
# them end to end needs an environment of its own rather than one of theirs.
dependencies = [
  "clipmill-worker-vad",
  "clipmill-worker-asr-whispercpp",
  "clipmill-worker-align",
]

[tool.uv.sources]
clipmill-worker-vad = { path = "../../../workers/vad", editable = true }
clipmill-worker-asr-whispercpp = { path = "../../../workers/asr-whispercpp", editable = true }
clipmill-worker-align = { path = "../../../workers/align", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
