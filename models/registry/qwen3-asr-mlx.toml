# The accelerated ASR primary on Apple silicon. Selected per device by measured benchmark, never by static config.
#
# Every file is pinned by digest and the revision is pinned by commit, so
# `fetch-models.sh` verifies rather than trusts. The licence class is what
# `check-models.py` enforces: weights ship inside what users publish.
name = "qwen3-asr-mlx"
capability = "asr"
family = "qwen3-asr"
runtime = "mlx"
backend = "mlx"
quantization = "int4"

[source]
provider = "https://huggingface.co"
repo = "mlx-community/Qwen3-ASR-1.7B-4bit"
revision = "78a389c776a5483b2d0d4ea5494e11012e0d6159"

[license]
spdx = "Apache-2.0"
class = "permissive"

[memory]
# Exact on-disk weight bytes, and the allowance a runtime needs on top.
# Admission adds them; a worker that cannot fit both is not given the task.
weights_bytes = 1605879758
runtime_overhead_bytes = 2147483648

