# Forced alignment as its own stage: word timing never comes from a decoder's tokens.
#
# Every file is pinned by digest and the revision is pinned by commit, so
# `fetch-models.sh` verifies rather than trusts. The licence class is what
# `check-models.py` enforces: weights ship inside what users publish.
name = "qwen3-aligner-mlx"
capability = "forced-align"
family = "qwen3-aligner"
runtime = "mlx"
backend = "mlx"
quantization = "int4"

[source]
provider = "https://huggingface.co"
repo = "mlx-community/Qwen3-ForcedAligner-0.6B-4bit"
revision = "2f652af86ae0c73fe189b9429225c908ce4bf020"

[license]
source = "repo-metadata"
spdx = "Apache-2.0"
class = "permissive"

[memory]
# Exact on-disk weight bytes, and the allowance a runtime needs on top.
# Admission adds them; a worker that cannot fit both is not given the task.
weights_bytes = 974103872
runtime_overhead_bytes = 1073741824

