# Meaning search: one vector per sentence and per remembered event, so "where
# do they talk about pricing" also finds "what it costs". A 118M-parameter
# multilingual encoder (about 100 languages), quantized to 8 bits, on
# onnxruntime on every platform.
name = "multilingual-e5-small"
capability = "embed"
family = "e5"
runtime = "onnxruntime"
backend = "onnx-cpu"
quantization = "int8"

# How the model library presents it. Prose, not identity: the digest
# ignores this table, so rewording it re-keys nothing.
[catalog]
title = "E5 small (multilingual)"
summary = "Small and fast. Lets search find moments by meaning, in about 100 languages."
recommended = true

[source]
provider = "https://huggingface.co"
repo = "Xenova/multilingual-e5-small"
revision = "761b726dd34fb83930e26aab4e9ac3899aa1fa78"

[license]
# An ONNX export that states no licence of its own; its base model states MIT.
source = "inherited"
spdx = "MIT"
class = "permissive"

[license.inherited_from]
repo = "intfloat/multilingual-e5-small"
revision = "614241f622f53c4eeff9890bdc4f31cfecc418b3"
spdx = "MIT"

[memory]
# Exact on-disk bytes of the three files, and onnxruntime's allowance for a
# batch of sentences on top.
weights_bytes = 135391573
runtime_overhead_bytes = 268435456

