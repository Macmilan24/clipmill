# Bill of materials — the pinned substrate (decision R4, book ch. 9).
# The substrate (FFmpeg build, SQLite floor) is pinned per release with
# escape hatches; models stay fluid behind adapters. fetch scripts verify
# every artifact against these hashes before installing it.

[ffmpeg]
version = "8.1.2"
provider = "https://ffmpeg.martin-riedl.de (static builds, ffmpeg + ffprobe)"

[ffmpeg.macos-arm64]
build = "1783011502_8.1.2"
license_mode = "gpl-v3"
redistributable = true
ffmpeg_url = "https://ffmpeg.martin-riedl.de/download/macos/arm64/1783011502_8.1.2/ffmpeg.zip"
ffmpeg_sha256 = "ef1aa60006c7b77ce170c1608c08d8e4ba1c30c5746f2ac986ded932d0ac2c3c"
ffprobe_url = "https://ffmpeg.martin-riedl.de/download/macos/arm64/1783011502_8.1.2/ffprobe.zip"
ffprobe_sha256 = "c39787f4af7a3932502d2d48db6f6feaaa836b48a73ef78c32cc3285df61dfaf"

[ffmpeg.linux-amd64]
build = "1783011670_8.1.2"
# This upstream static build enables DeckLink and is therefore configured as
# FFmpeg "nonfree". Phase 0 downloads it for development/CI and publishes no
# binary. Desktop/release packaging MUST replace it with a redistributable
# build; the security gate asserts this restriction instead of hiding it.
license_mode = "gpl-v3-nonfree"
redistributable = false
ffmpeg_url = "https://ffmpeg.martin-riedl.de/download/linux/amd64/1783011670_8.1.2/ffmpeg.zip"
ffmpeg_sha256 = "56452c0bfc4ee0325cd615d62f46ba8264f62eed34f727c2224c6c84fa7b8719"
ffprobe_url = "https://ffmpeg.martin-riedl.de/download/linux/amd64/1783011670_8.1.2/ffprobe.zip"
ffprobe_sha256 = "c6f2d36e98f9a4445fad0b0be539f4c4faf13fd502116bf131becd53f56cd390"

[sqlite]
# WAL-reset corruption race fixed in 3.51.3 (2026-03-13); the daemon refuses
# to enable WAL below this version at runtime (decision R3).
min_version = "3.51.3"
min_version_number = 3051003
