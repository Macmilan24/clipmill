# Bill of materials — the pinned substrate (decision R4, book ch. 9).
# The substrate (FFmpeg build, SQLite floor) is pinned per release with
# escape hatches; models stay fluid behind adapters. fetch scripts verify
# every artifact against these hashes before installing it.

[ffmpeg]
version = "8.1.2"
provider = "https://ffmpeg.martin-riedl.de (static builds, ffmpeg + ffprobe)"

[ffmpeg.macos-arm64]
build = "1783011502_8.1.2"
license_mode = "gpl-v3"
redistributable = true
ffmpeg_url = "https://ffmpeg.martin-riedl.de/download/macos/arm64/1783011502_8.1.2/ffmpeg.zip"
ffmpeg_sha256 = "ef1aa60006c7b77ce170c1608c08d8e4ba1c30c5746f2ac986ded932d0ac2c3c"
ffprobe_url = "https://ffmpeg.martin-riedl.de/download/macos/arm64/1783011502_8.1.2/ffprobe.zip"
ffprobe_sha256 = "c39787f4af7a3932502d2d48db6f6feaaa836b48a73ef78c32cc3285df61dfaf"

[ffmpeg.linux-amd64]
build = "1783011670_8.1.2"
# This upstream static build enables DeckLink and is therefore configured as
# FFmpeg "nonfree". Phase 0 downloads it for development/CI and publishes no
# binary. Desktop/release packaging MUST replace it with a redistributable
# build; the security gate asserts this restriction instead of hiding it.
license_mode = "gpl-v3-nonfree"
redistributable = false
ffmpeg_url = "https://ffmpeg.martin-riedl.de/download/linux/amd64/1783011670_8.1.2/ffmpeg.zip"
ffmpeg_sha256 = "56452c0bfc4ee0325cd615d62f46ba8264f62eed34f727c2224c6c84fa7b8719"
ffprobe_url = "https://ffmpeg.martin-riedl.de/download/linux/amd64/1783011670_8.1.2/ffprobe.zip"
ffprobe_sha256 = "c6f2d36e98f9a4445fad0b0be539f4c4faf13fd502116bf131becd53f56cd390"

[fonts]
# Captions rasterize through libass, which resolves a face by family name from
# whatever fontconfig can see. A render that picks up a host-installed font is
# a render nobody else can reproduce, so exactly one pinned face is staged into
# a private directory per render and libass is pointed at that alone (ch. 19).

[fonts.captions]
family = "Inter"
style = "Bold"
version = "4.1"
license = "OFL-1.1"
provider = "https://github.com/rsms/inter (upstream release archive)"
archive_url = "https://github.com/rsms/inter/releases/download/v4.1/Inter-4.1.zip"
archive_sha256 = "9883fdd4a49d4fb66bd8177ba6625ef9a64aa45899767dde3d36aa425756b11e"
# The archive is pinned, and so is the one member taken out of it: the render
# manifest states this digest, so a font swap changes the recorded engine
# identity instead of quietly changing the pixels.
member = "extras/ttf/Inter-Bold.ttf"
member_sha256 = "288316099b1e0a47a4716d159098005eef7c0066921f34e3200393dbdb01947f"
license_member = "LICENSE.txt"
license_sha256 = "262481e844521b326f5ecd053e59b98c8b2da78c8ee1bdbb6e8174305e54935a"

# The other caption faces a creator may choose. Each is one static file taken
# from its upstream repository at a pinned commit, with its licence, and each
# name matches crates/clipmill-captions/src/fonts.rs. A render stages only the
# face its captions use, and the manifest records that face's digest.
[fonts.faces]
ids = "montserrat,poppins,anton,bebasneue,luckiestguy,dmserifdisplay"

[fonts.face.montserrat]
file = "Montserrat-Black.ttf"
