version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directories:
      - /workers/sdk
      - /workers/echo
      - /workers/vad
      - /workers/asr-whispercpp
      - /workers/align
      - /workers/speech-mlx
      - /workers/shots
      - /workers/faces
      - /workers/editorial
      - /eval/harness
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
