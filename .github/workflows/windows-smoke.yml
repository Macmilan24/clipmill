name: windows-smoke

# Installs the Windows build a release run made, on a Windows machine, and
# checks that it runs with nothing set up by hand (tools/drills/packaged_smoke.py):
# the daemon starts and answers through its handshake, installs every
# component from the network, runs its workers, probes a recording made with
# the app's own FFmpeg, and stops when asked.
#
# Release builds call this workflow with their own installer and commit.
# Pull requests that change the smoke test exercise it on the latest successful
# release build. It can also be run by hand against a specific build.
on:
  workflow_call:
    inputs:
      release-run:
        type: string
        required: true
      compatibility:
        type: boolean
        required: true
  pull_request:
    paths:
      - .github/workflows/windows-smoke.yml
      - tools/drills/packaged_smoke.py
      - eval/harness/src/clipmill_eval/client.py
  workflow_dispatch:
    inputs:
      release-run:
        description: The release run whose Windows installer to test (default, the newest that succeeded)
        required: false
      compatibility:
        description: Test upgrades and Windows Whisper CPU compatibility (ClipMill 0.5.1 or later)
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-smoke-${{ github.ref }}-${{ inputs.release-run || github.run_id }}
  cancel-in-progress: true

env:
  # The Python every uv command uses, whatever the runner image ships: the
  # project's version (.python-version). Left to choose, uv took the image's
  # newest Python, for which pyarrow publishes no wheel, and every job that
  # syncs a worker tried to compile it.
  UV_PYTHON: '3.12'

jobs:
  smoke:
    name: install and run (windows)
    # Build and clean-install on Server 2025. Exercise processor emulation
    # on an older Windows kernel as well, with the same packaged binaries.
    runs-on: ${{ inputs.compatibility && 'windows-2022' || 'windows-2025' }}
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Fetch the release run's Windows installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_RUN: ${{ inputs.release-run }}
        run: |
          run="${RELEASE_RUN:-$(gh run list --workflow release.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')}"
          echo "testing the Windows installer from release run $run"
          gh run download "$run" --name installers-windows-x86_64 --dir installer
          ls -la installer
      - name: Verify in-place upgrades from released Windows installers
        if: inputs.compatibility
        shell: pwsh
        run: |
          $setup = Get-Item 'installer/*-setup.exe'
          ./tools/drills/windows-upgrade.ps1 -CandidateInstaller $setup.FullName -WorkDir "$env:RUNNER_TEMP/clipmill-upgrade"
      # NSIS: /S installs silently, and /D, which must come last, names the
      # folder.
      - name: Install it silently
        shell: pwsh
        run: |
          $setup = Get-ChildItem installer -Filter '*-setup.exe' | Select-Object -First 1
          $target = Join-Path $env:RUNNER_TEMP 'ClipMill'
          $installer = Start-Process -FilePath $setup.FullName -ArgumentList '/S', "/D=$target" -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "the installer exited with $($installer.ExitCode)" }
          Get-ChildItem $target | Format-Table Name, Length
          "APP_DIR=$target" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Run it
        shell: pwsh
        run: >
          uv run --project eval/harness python tools/drills/packaged_smoke.py
          --app-dir "$env:APP_DIR" --work-dir "$env:RUNNER_TEMP/smoke"
      - name: Transcribe speech on the host, Ivy Bridge and Nehalem CPU profiles
        if: inputs.compatibility
        shell: pwsh
        run: >-
          ./tools/drills/whisper_windows_compat.ps1 -AppDir "$env:APP_DIR"
          -DataDir "$env:RUNNER_TEMP/smoke/data" -WorkDir "$env:RUNNER_TEMP/whisper-compat"
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: windows-smoke-logs
          path: |
            ${{ runner.temp }}/smoke/daemon.log
            ${{ runner.temp }}/smoke/data/logs/
            ${{ runner.temp }}/clipmill-upgrade/daemon-*.log
            ${{ runner.temp }}/clipmill-upgrade/project.json
            ${{ runner.temp }}/whisper-compat/whisper-windows-compat.json
          if-no-files-found: ignore
          retention-days: 14
