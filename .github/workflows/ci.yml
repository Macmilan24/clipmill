name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: contracts (drift + fixtures)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: bufbuild/buf-action@fd21066df7214747548607aaa45548ba2b9bc1ff # v1.4.0
        with:
          setup_only: true
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: typify-cache
        with:
          path: ~/.cargo/bin/cargo-typify
          key: cargo-typify-${{ runner.os }}-v1
      - name: Install cargo-typify
        if: steps.typify-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-typify --locked
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - run: pnpm install --frozen-lockfile
      - name: buf lint
        run: buf lint
      - name: buf breaking (against main)
        if: github.event_name == 'pull_request'
        run: buf breaking --against ".git#branch=origin/main"
      - name: schema-lint (rational-time rule, D06)
        run: python3 tools/schema-lint/check.py contracts/schemas/*.json
      - name: Fixture validation (valid must pass, invalid must fail)
        run: |
          uvx check-jsonschema --schemafile contracts/schemas/clipmill.artifact.manifest.v1.json \
            contracts/fixtures/artifact.manifest/valid/*.json
          for f in contracts/fixtures/artifact.manifest/invalid/*.json; do
            if uvx check-jsonschema --schemafile contracts/schemas/clipmill.artifact.manifest.v1.json "$f" 2>/dev/null; then
              echo "::error::invalid fixture $f unexpectedly passed schema validation"
              exit 1
            fi
          done
          uvx check-jsonschema --schemafile contracts/schemas/clipmill.source_map.v1.json \
            contracts/fixtures/source_map/valid/*.json
          for f in contracts/fixtures/source_map/invalid/*.json; do
            if uvx check-jsonschema --schemafile contracts/schemas/clipmill.source_map.v1.json "$f" 2>/dev/null; then
              echo "::error::invalid source-map fixture $f unexpectedly passed schema validation"
              exit 1
            fi
          done
      - name: Codegen drift (generated code must match contracts/)
        run: |
          ./tools/codegen/generate.sh
          git diff --exit-code || {
            echo "::error::generated code drifted - run 'just codegen' and commit the result"
            exit 1
          }

  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  python:
    name: python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
      - name: ruff
        run: |
          uvx ruff check .
          uvx ruff format --check .
      - name: pytest (all projects)
        run: |
          for project in workers/sdk workers/echo eval/harness; do
            echo "==> $project"
            (cd "$project" && uv sync --quiet && uv run pytest)
          done

  kill-drill:
    name: kill-drill (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: ./tools/drills/kill-drill.sh 25

  cache-drill:
    name: cache-drill (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: ./tools/drills/cache-drill.sh 25

  media-conformance:
    name: media-conformance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Fetch and verify pinned FFmpeg sidecars
        run: ./tools/fetch-ffmpeg.sh
      - run: ./tools/drills/media-drill.sh 1

  worker-recovery:
    name: worker-recovery (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
      - run: uv sync --frozen --project workers/echo
      - run: ./tools/drills/worker-drill.sh 25

  network-denial:
    name: network-denial (Local Lock gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
      - name: Allow unprivileged user namespaces (Ubuntu 24.04 default restricts them)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Prefetch and build everything (outside the namespace)
        run: |
          ./tools/fetch-ffmpeg.sh
          uv sync --frozen --project workers/echo
          cargo test --workspace --no-run
      - name: Run the suite inside a no-network namespace
        run: unshare -rn ./tools/drills/network-denial.sh

  supply-chain:
    name: supply chain
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: cargo-deny (advisories + AGPL-compatible license allowlist)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit (production deps)
        run: pnpm audit --prod --audit-level high

  ts:
    name: ts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
