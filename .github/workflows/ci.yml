name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: contracts (drift + fixtures)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          setup_only: true
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: typify-cache
        with:
          path: ~/.cargo/bin/cargo-typify
          key: cargo-typify-${{ runner.os }}-v1
      - name: Install cargo-typify
        if: steps.typify-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-typify --locked
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: pnpm install --frozen-lockfile
      - name: buf lint
        run: buf lint
      - name: buf breaking (against main)
        if: github.event_name == 'pull_request'
        run: buf breaking --against ".git#branch=origin/main"
      - name: schema-lint (rational-time rule, D06)
        run: python3 tools/schema-lint/check.py contracts/schemas/*.json
      - name: Fixture validation (valid must pass, invalid must fail)
        run: |
          # Every fixtures/<name>/ with a valid/ subdirectory validates against
          # contracts/schemas/clipmill.<name>.v1.json (proto/ has no schema).
          checked=0
          for dir in contracts/fixtures/*/; do
            name="$(basename "$dir")"
            schema="contracts/schemas/clipmill.${name}.v1.json"
            [ -f "$schema" ] && [ -d "${dir}valid" ] || continue
            uvx check-jsonschema --schemafile "$schema" "$dir"valid/*.json
            for f in "$dir"invalid/*.json; do
              if uvx check-jsonschema --schemafile "$schema" "$f" 2>/dev/null; then
                echo "::error::invalid fixture $f unexpectedly passed schema validation"
                exit 1
              fi
            done
            checked=$((checked + 1))
          done
          if [ "$checked" -lt 23 ]; then
            echo "::error::fixture loop found only $checked schema directories - the dir/schema naming pairing broke"
            exit 1
          fi
      - name: Codegen drift (generated code must match contracts/)
        run: |
          ./tools/codegen/generate.sh
          git diff --exit-code || {
            echo "::error::generated code drifted - run 'just codegen' and commit the result"
            exit 1
          }

  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Install Linux WebView build dependencies (clipmill-shell)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  python:
    name: python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: ruff
        run: |
          uvx ruff check .
          uvx ruff format --check .
      # The shots worker's detector links the desktop OpenCV wheel, which
      # resolves libGL at import time even though nothing here opens a window.
      # PySceneDetect asks for that wheel by name and the headless swap is not
      # available to us: see workers/shots/pyproject.toml.
      - name: Install the OpenCV import dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0t64
      - name: pytest (all projects)
        run: |
          for project in workers/sdk workers/echo workers/vad workers/asr-whispercpp workers/align workers/speech-mlx workers/shots workers/faces eval/harness; do
            echo "==> $project"
            (cd "$project" && uv sync --quiet && uv run pytest)
          done

  kill-drill:
    name: kill-drill (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: ./tools/drills/kill-drill.sh 25

  cache-drill:
    name: cache-drill (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: ./tools/drills/cache-drill.sh 25

  media-conformance:
    name: media-conformance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Restore the pinned media substrate
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/bin
            .cache/fonts
          key: media-substrate-${{ runner.os }}-${{ hashFiles('bom.toml') }}
      - name: Fetch and verify pinned FFmpeg sidecars
        run: ./tools/fetch-ffmpeg.sh
      - run: ./tools/drills/media-drill.sh 1

  edit-ir:
    name: edit-ir (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: ./tools/drills/ir-drill.sh 1

  worker-plane:
    name: worker-plane (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: ./tools/drills/worker2-drill.sh 1

  speech-conformance:
    name: speech-conformance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Restore the pinned media substrate
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/bin
            .cache/fonts
          key: media-substrate-${{ runner.os }}-${{ hashFiles('bom.toml') }}
      - name: Fetch and verify pinned FFmpeg sidecars
        run: ./tools/fetch-ffmpeg.sh
      # Keyed on the manifests, so re-pinning a model fetches it again and
      # nothing else. The weights are half a gigabyte; a cache keyed on
      # anything looser would either serve stale digests or never hit.
      - name: Restore the pinned speech weights
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/models
          key: speech-models-${{ runner.os }}-${{ hashFiles('models/registry/silero-vad.toml', 'models/registry/whisper-base.toml', 'models/registry/wav2vec2-ctc-en.toml') }}
      - name: Fetch and verify the pinned speech weights
        run: ./tools/fetch-models.sh silero-vad whisper-base wav2vec2-ctc-en
      # The fixture is spoken by the platform's own voice. macOS has `say`;
      # Linux needs one installed, and the drill refuses to guess.
      - name: Install a speech synthesizer (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng
      - run: ./tools/drills/speech-drill.sh 1

  shots-conformance:
    name: shots-conformance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Restore the pinned media substrate
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/bin
            .cache/fonts
          key: media-substrate-${{ runner.os }}-${{ hashFiles('bom.toml') }}
      # The only external input this gate has. There are no weights: the stage
      # runs no model, and the fixture is generated by the same pinned encoder
      # that decodes it.
      - name: Fetch and verify pinned FFmpeg sidecars
        run: ./tools/fetch-ffmpeg.sh
      # See workers/shots/pyproject.toml: the detector's OpenCV wheel resolves
      # libGL on import, and GitHub's Linux image does not carry it.
      - name: Install the OpenCV import dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0t64
      - run: ./tools/drills/shots-drill.sh 1

  evidence-index:
    name: evidence-index (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The index, the search, and the score card each derive one JSON document
      # from others, so they need no media and no weights. The analyze gate at
      # the end of this job does: it runs the whole pipeline against a real
      # daemon and a real worker, which means a decoder and the shot detector's
      # environment. Still no weights — the recording it analyses is silent, and
      # the speech half is covered by speech-conformance.
      - name: Restore the pinned media substrate
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/bin
            .cache/fonts
          key: media-substrate-${{ runner.os }}-${{ hashFiles('bom.toml') }}
      - name: Fetch and verify pinned FFmpeg sidecars
        run: ./tools/fetch-ffmpeg.sh
      # See workers/shots/pyproject.toml: the detector's OpenCV wheel resolves
      # libGL on import, and GitHub's Linux image does not carry it.
      - name: Install the OpenCV import dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0t64
      - name: Build the shots worker the analyze DAG leases
        run: uv sync --frozen --project workers/shots
      - run: ./tools/drills/evidence-drill.sh 1
      - run: ./tools/drills/discovery-drill.sh 1
      - run: ./tools/drills/ranking-drill.sh 1

  render-conformance:
    name: render-conformance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Restore the pinned media substrate
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/bin
            .cache/fonts
          key: media-substrate-${{ runner.os }}-${{ hashFiles('bom.toml') }}
      - name: Fetch and verify the pinned FFmpeg sidecars and caption font
        run: ./tools/fetch-ffmpeg.sh
      - run: ./tools/drills/render-drill.sh 1
      - name: Publish the rendered first slice
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: first-slice-${{ matrix.os }}
          path: target/render-demo/
          if-no-files-found: ignore
          retention-days: 7

  ingest-conformance:
    name: ingest-conformance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Restore the pinned media substrate
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/bin
            .cache/fonts
          key: media-substrate-${{ runner.os }}-${{ hashFiles('bom.toml') }}
      - name: Fetch and verify pinned FFmpeg sidecars
        run: ./tools/fetch-ffmpeg.sh
      - run: ./tools/drills/ingest-drill.sh 1

  shell-link:
    name: shell-link (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Install Linux WebView build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf
      - name: Restore the pinned media substrate
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/bin
            .cache/fonts
          key: media-substrate-${{ runner.os }}-${{ hashFiles('bom.toml') }}
      - name: Fetch and verify pinned FFmpeg sidecars
        run: ./tools/fetch-ffmpeg.sh
      - run: ./tools/drills/shell-drill.sh 1

  reframe:
    name: reframe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Restore the pinned media substrate
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/bin
            .cache/fonts
          key: media-substrate-${{ runner.os }}-${{ hashFiles('bom.toml') }}
      - name: Fetch and verify pinned FFmpeg sidecars
        run: ./tools/fetch-ffmpeg.sh
      - name: Restore the pinned face weights
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/models
          key: models-${{ runner.os }}-${{ hashFiles('models/registry/**') }}
      - name: Fetch and verify the pinned face weights
        run: ./tools/fetch-models.sh yunet-face
      - run: uv sync --frozen --project workers/faces
      - run: ./tools/drills/reframe-drill.sh 1

  worker-recovery:
    name: worker-recovery (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --frozen --project workers/echo
      - run: ./tools/drills/worker-drill.sh 25

  phase0-eval:
    name: phase0-eval (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Restore the pinned media substrate
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/bin
            .cache/fonts
          key: media-substrate-${{ runner.os }}-${{ hashFiles('bom.toml') }}
      - name: Fetch and verify pinned FFmpeg sidecars
        run: ./tools/fetch-ffmpeg.sh
      - run: uv sync --frozen --project eval/harness
      - run: ./tools/drills/device-drill.sh 1
      - run: ./tools/drills/eval-smoke.sh 1

  network-denial:
    name: network-denial (Local Lock gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Allow unprivileged user namespaces (Ubuntu 24.04 default restricts them)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install Linux WebView build dependencies (clipmill-shell)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf
      - name: Restore the pinned media substrate
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/bin
            .cache/fonts
          key: media-substrate-${{ runner.os }}-${{ hashFiles('bom.toml') }}
      - name: Prefetch and build everything (outside the namespace)
        run: |
          ./tools/fetch-ffmpeg.sh
          pnpm install --frozen-lockfile
          # Every locked environment, not a hand-kept subset. The security gate
          # runs inside the namespace and walks all of them, and uv there has no
          # network — so a list maintained by hand is a list that goes stale the
          # first time somebody adds a worker, and fails in the one job whose
          # whole purpose is to have no way of recovering.
          while IFS= read -r lockfile; do
            uv sync --frozen --project "$(dirname "$lockfile")"
          done < <(find . -name uv.lock -not -path './.git/*' -not -path './target/*' | sort)
          cargo test --workspace --no-run
      - name: Run the suite inside a no-network namespace
        run: unshare -rn ./tools/drills/network-denial.sh

  supply-chain:
    name: supply chain
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: cargo-deny (advisories + AGPL-compatible license allowlist)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit (production deps)
        run: pnpm audit --prod --audit-level high
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Sync every frozen Python environment
        run: |
          for project in workers/sdk workers/echo workers/vad workers/asr-whispercpp workers/align workers/speech-mlx workers/shots workers/faces eval/harness; do
            uv sync --frozen --project "$project"
          done
      - name: Audit every Python lockfile
        run: ./tools/security/python-audit.sh
      - name: Node and Python license policy
        run: |
          python3 tools/security/check-node-licenses.py
          python3 tools/security/check-python-licenses.py

  phase0-security:
    name: phase0-security
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Restore the pinned media substrate
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/bin
            .cache/fonts
          key: media-substrate-${{ runner.os }}-${{ hashFiles('bom.toml') }}
      - name: Install locked inputs and pinned FFmpeg sidecars
        run: |
          ./tools/fetch-ffmpeg.sh
          pnpm install --frozen-lockfile
          for project in workers/sdk workers/echo workers/vad workers/asr-whispercpp workers/align workers/speech-mlx workers/shots workers/faces eval/harness; do
            uv sync --frozen --project "$project"
          done
      - name: Reproducible security gate
        run: ./tools/security/security-gate.sh
      - name: Threat review for sensitive pull requests
        if: github.event_name == 'pull_request'
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        run: python3 tools/security/threat-review.py --base "$PR_BASE"
      - name: Verify committed signed Seed-40 exit evidence
        run: ./tools/drills/verify-phase0-attestation.sh
      # The accelerated speech path cannot be measured here — no hosted runner
      # has an Apple GPU — so what CI checks is the signed evidence from the
      # machine that could, exactly as it checks the Seed-40 proof.
      - name: Verify committed signed MLX selection evidence
        run: ./tools/drills/verify-mlx-attestation.sh

  ts:
    name: ts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format
      - name: Design-token drift (tokens.css must match tokens.json)
        run: pnpm --filter @clipmill/tokens check-drift
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
