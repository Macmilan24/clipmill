name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: contracts (drift + fixtures)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          setup_only: true
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: typify-cache
        with:
          path: ~/.cargo/bin/cargo-typify
          key: cargo-typify-${{ runner.os }}-v1
      - name: Install cargo-typify
        if: steps.typify-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-typify --locked
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: pnpm install --frozen-lockfile
      - name: buf lint
        run: buf lint
      - name: buf breaking (against main)
        if: github.event_name == 'pull_request'
        run: buf breaking --against ".git#branch=origin/main"
      - name: schema-lint (rational-time rule, D06)
        run: python3 tools/schema-lint/check.py contracts/schemas/*.json
      - name: Fixture validation (valid must pass, invalid must fail)
        run: |
          # Every fixtures/<name>/ with a valid/ subdirectory validates against
          # contracts/schemas/clipmill.<name>.v1.json (proto/ has no schema).
          checked=0
          for dir in contracts/fixtures/*/; do
            name="$(basename "$dir")"
            schema="contracts/schemas/clipmill.${name}.v1.json"
            [ -f "$schema" ] && [ -d "${dir}valid" ] || continue
            uvx check-jsonschema --schemafile "$schema" "$dir"valid/*.json
            for f in "$dir"invalid/*.json; do
              if uvx check-jsonschema --schemafile "$schema" "$f" 2>/dev/null; then
                echo "::error::invalid fixture $f unexpectedly passed schema validation"
                exit 1
              fi
            done
            checked=$((checked + 1))
          done
          if [ "$checked" -lt 11 ]; then
            echo "::error::fixture loop found only $checked schema directories - the dir/schema naming pairing broke"
            exit 1
          fi
      - name: Codegen drift (generated code must match contracts/)
        run: |
          ./tools/codegen/generate.sh
          git diff --exit-code || {
            echo "::error::generated code drifted - run 'just codegen' and commit the result"
            exit 1
          }

  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Install Linux WebView build dependencies (clipmill-shell)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  python:
    name: python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: ruff
        run: |
          uvx ruff check .
          uvx ruff format --check .
      - name: pytest (all projects)
        run: |
          for project in workers/sdk workers/echo eval/harness; do
            echo "==> $project"
            (cd "$project" && uv sync --quiet && uv run pytest)
          done

  kill-drill:
    name: kill-drill (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: ./tools/drills/kill-drill.sh 25

  cache-drill:
    name: cache-drill (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: ./tools/drills/cache-drill.sh 25

  media-conformance:
    name: media-conformance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Fetch and verify pinned FFmpeg sidecars
        run: ./tools/fetch-ffmpeg.sh
      - run: ./tools/drills/media-drill.sh 1

  ingest-conformance:
    name: ingest-conformance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Fetch and verify pinned FFmpeg sidecars
        run: ./tools/fetch-ffmpeg.sh
      - run: ./tools/drills/ingest-drill.sh 1

  shell-link:
    name: shell-link (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Install Linux WebView build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf
      - name: Fetch and verify pinned FFmpeg sidecars
        run: ./tools/fetch-ffmpeg.sh
      - name: Build the daemon the shell talks to
        run: cargo build -p clipmilld
      - name: Shell reads real measured hardware, then survives losing the daemon
        run: cargo test -p clipmill-shell -- --ignored --nocapture

  worker-recovery:
    name: worker-recovery (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --frozen --project workers/echo
      - run: ./tools/drills/worker-drill.sh 25

  phase0-eval:
    name: phase0-eval (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Fetch and verify pinned FFmpeg sidecars
        run: ./tools/fetch-ffmpeg.sh
      - run: uv sync --frozen --project eval/harness
      - run: ./tools/drills/device-drill.sh 1
      - run: ./tools/drills/eval-smoke.sh 1

  network-denial:
    name: network-denial (Local Lock gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Allow unprivileged user namespaces (Ubuntu 24.04 default restricts them)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install Linux WebView build dependencies (clipmill-shell)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf
      - name: Prefetch and build everything (outside the namespace)
        run: |
          ./tools/fetch-ffmpeg.sh
          pnpm install --frozen-lockfile
          uv sync --frozen --project workers/sdk
          uv sync --frozen --project workers/echo
          uv sync --frozen --project eval/harness
          cargo test --workspace --no-run
      - name: Run the suite inside a no-network namespace
        run: unshare -rn ./tools/drills/network-denial.sh

  supply-chain:
    name: supply chain
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: cargo-deny (advisories + AGPL-compatible license allowlist)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit (production deps)
        run: pnpm audit --prod --audit-level high
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Sync every frozen Python environment
        run: |
          for project in workers/sdk workers/echo eval/harness; do
            uv sync --frozen --project "$project"
          done
      - name: Audit every Python lockfile
        run: ./tools/security/python-audit.sh
      - name: Node and Python license policy
        run: |
          python3 tools/security/check-node-licenses.py
          python3 tools/security/check-python-licenses.py

  phase0-security:
    name: phase0-security
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked inputs and pinned FFmpeg sidecars
        run: |
          ./tools/fetch-ffmpeg.sh
          pnpm install --frozen-lockfile
          for project in workers/sdk workers/echo eval/harness; do
            uv sync --frozen --project "$project"
          done
      - name: Reproducible security gate
        run: ./tools/security/security-gate.sh
      - name: Threat review for sensitive pull requests
        if: github.event_name == 'pull_request'
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        run: python3 tools/security/threat-review.py --base "$PR_BASE"
      - name: Verify committed signed Seed-40 exit evidence
        run: ./tools/drills/verify-phase0-attestation.sh

  ts:
    name: ts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format
      - name: Design-token drift (tokens.css must match tokens.json)
        run: pnpm --filter @clipmill/tokens check-drift
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
