name: release
run-name: Draft 0.5.2 from its verified installers

on: workflow_dispatch

permissions:
  contents: read
  actions: read

env:
  GH_REPO: Macmilan24/clipmill
  TAG: v0.5.2
  REVISION: 5c93ae4a3b4fab1e554fac551facbb79d19a8581
  BUILD: '45185028658'
  WINDOWS_CHECK: '45234878634'
  CHECK_REVISION: 9b2203bab14873831541cadef46242b6d396a468

jobs:
  verify:
    if: github.repository == 'Macmilan24/clipmill' && github.ref == 'refs/heads/release/0.5.2-installers'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify the tagged builds and the Windows compatibility result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)" = "$REVISION"
          gh api "repos/$GH_REPO/actions/runs/$BUILD" | jq -e --arg rev "$REVISION" --arg tag "$TAG" '
            .event == "push" and .path == ".github/workflows/release.yml" and
            .head_sha == $rev and .head_branch == $tag'
          gh api "repos/$GH_REPO/actions/runs/$BUILD/jobs" | jq -e '
            ([.jobs[] | select(.name | startswith("build (")) | select(.conclusion == "success") | .name] | sort) ==
            ["build (linux-x86_64)", "build (macos-arm64)", "build (windows-x86_64)"]'
          gh api "repos/$GH_REPO/actions/runs/$WINDOWS_CHECK" | jq -e --arg rev "$CHECK_REVISION" '
            .event == "workflow_dispatch" and .path == ".github/workflows/windows-smoke.yml" and
            .head_sha == $rev and .conclusion == "success"'
          job="$(gh api "repos/$GH_REPO/actions/runs/$WINDOWS_CHECK/jobs" --jq '.jobs[] | select(.name == "install and run (windows)" and .conclusion == "success") | .id')"
          gh api --allow-escape-sequences "repos/$GH_REPO/actions/jobs/$job/logs" > "$RUNNER_TEMP/windows-check.log"
          grep -Fq "testing the Windows installer from release run $BUILD" "$RUNNER_TEMP/windows-check.log"
          for profile in native ivybridge nehalem; do
            grep -Fq "$profile/transcription passed" "$RUNNER_TEMP/windows-check.log"
          done

  draft:
    name: Create the draft from the tagged build
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          github-token: ${{ github.token }}
          run-id: '45185028658'
          pattern: installers-*
          merge-multiple: true
          path: dist-release
      - name: Checksum the four installers and create a draft
        working-directory: dist-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          installers=(ClipMill_0.5.2_aarch64.dmg ClipMill_0.5.2_amd64.AppImage ClipMill_0.5.2_amd64.deb ClipMill_0.5.2_x64-setup.exe)
          for file in "${installers[@]}"; do
            test -s "$file"
            test ! -L "$file"
          done
          files=(*)
          test "${#files[@]}" -eq "${#installers[@]}"
          sha256sum "${installers[@]}" > SHA256SUMS.txt
          gh release create "$TAG" --verify-tag --draft --title "ClipMill 0.5.2" \
            --notes "Dependency security updates." \
            "${installers[@]}" SHA256SUMS.txt
