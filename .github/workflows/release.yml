name: release

# Pushing a tag v<version> builds the installers on each platform's own runner
# and collects them into a draft GitHub release, which a person reviews and
# publishes. Only the final job may write, and it runs no third-party code:
# it downloads what the read-only build jobs produced and hands it to `gh`.
#
# Run by hand on any branch, it is a trial build: the installers are kept as
# the run's artifacts and nothing is drafted.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      # A secret cannot appear in a condition; whether it exists can.
      HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          # The oldest supported Ubuntu, so the AppImage and the .deb run on
          # every distribution with at least its glibc.
          - name: linux-x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
          # Beta. The NSIS installer fetches WebView2 where Windows lacks it.
          - name: windows-x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: release-${{ matrix.target }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      # WebView and bundler dependencies, and the libraries the shots worker's
      # OpenCV wheel resolves when the staged components are imported below.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf \
            libgl1 libglib2.0-0 file
      - run: pnpm install --frozen-lockfile
      - name: Check the tag names this version
        if: github.event_name == 'push'
        shell: bash
        run: |
          version="$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the app version $version"
            exit 1
          fi
      # Every pinned download is checked against bom.toml, and every component
      # is installed once here exactly as the app would, then started.
      - name: Stage the daemon, sidecars, resources and components
        run: >
          uv run --no-project --with packaging==25.0
          python tools/release/stage.py --target ${{ matrix.target }} --verify-engine
      # Signing happens only where its secrets exist. Without an Apple
      # certificate the Mac app is ad-hoc signed and macOS asks the person to
      # allow it once (see docs/install.md).
      - name: Import the Apple signing certificate
        if: runner.os == 'macOS' && env.HAS_APPLE_CERTIFICATE == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 16)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          security list-keychain -d user -s "$keychain"
          rm -f "$RUNNER_TEMP/certificate.p12"
      - name: Build the installers
        shell: bash
        env:
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARY_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          NOTARY_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # The bundler signs and notarizes only when told who to sign as; an
          # empty identity would be a failed signature, not an ad-hoc one.
          if [ -n "$SIGNING_IDENTITY" ]; then
            export APPLE_SIGNING_IDENTITY="$SIGNING_IDENTITY"
            if [ -n "$NOTARY_ID" ] && [ -n "$NOTARY_PASSWORD" ] && [ -n "$NOTARY_TEAM" ]; then
              export APPLE_ID="$NOTARY_ID" APPLE_PASSWORD="$NOTARY_PASSWORD" APPLE_TEAM_ID="$NOTARY_TEAM"
            fi
          fi
          pnpm --filter @clipmill/desktop tauri build \
            --config src-tauri/tauri.release.conf.json \
            --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Collect the installers
        shell: bash
        run: |
          mkdir -p dist-release
          bundle="target/${{ matrix.target }}/release/bundle"
          find "$bundle" -maxdepth 2 -type f \
            \( -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*-setup.exe' \) \
            -exec cp {} dist-release/ \;
          ls -la dist-release
          test -n "$(ls dist-release)"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: installers-${{ matrix.name }}
          path: dist-release/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: publish (draft release)
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: installers-*
          merge-multiple: true
          path: dist-release
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist-release
          sha256sum * > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "ClipMill ${GITHUB_REF_NAME#v}" \
            --notes "Installers for macOS (Apple silicon), Linux (x86_64) and, in beta, Windows (x86_64). See docs/install.md for installing, and CHANGELOG.md for what changed. SHA256SUMS.txt lists every file's digest." \
            ./*
