# cargo-deny configuration — supply-chain policy for an AGPL-3.0-only project.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Every entry below is `unmaintained`, not a vulnerability and not unsound.
# All of them reach the build only through Tauri:
#
# - proc-macro-error, through glib-macros in the GTK3/gtk-rs stack that
#   Tauri's Linux WebView backend links against. WebKitGTK is the Linux
#   WebView and webkit2gtk still targets GTK3, so there is no alternative to
#   accept. Revisit when webkit2gtk-rs targets GTK4.
# - The unic-* crates, through urlpattern in tauri-utils. Revisit when
#   tauri-utils no longer depends on them.
#
# RustSec withdrew its gtk-rs GTK3 advisories (RUSTSEC-2024-0411 to 0420) on
# 2026-08-14, so they need no entry here.
#
# Listed by exact id rather than relaxing the advisory class, so a real
# vulnerability in any of these crates still fails the gate.
ignore = [
  "RUSTSEC-2024-0370", # proc-macro-error, through glib-macros (GTK3)
  "RUSTSEC-2025-0075", # unic-char-range, through urlpattern (tauri-utils)
  "RUSTSEC-2025-0080", # unic-common, through urlpattern (tauri-utils)
  "RUSTSEC-2025-0081", # unic-char-property, through urlpattern (tauri-utils)
  "RUSTSEC-2025-0098", # unic-ucd-version, through urlpattern (tauri-utils)
  "RUSTSEC-2025-0100", # unic-ucd-ident, through urlpattern (tauri-utils)
]

[licenses]
version = 2
# Dependencies must be AGPL-compatible. Our own crates are AGPL-3.0-only.
allow = [
  "AGPL-3.0-only",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "CC0-1.0",
]
confidence-threshold = 0.9

# Mozilla certificate data pulled by rustls-platform-verifier on wasm targets.
# CDLA permits redistribution with its license text; this is a data-only,
# crate/version-specific exception, not a new workspace-wide license allowance.
# https://cdla.dev/permissive-2-0/ (section 2.1)
[[licenses.exceptions]]
name = "webpki-root-certs"
version = "=1.0.12"
allow = ["CDLA-Permissive-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Intra-workspace path dependencies carry no version by design.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
