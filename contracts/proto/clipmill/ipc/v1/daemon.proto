// The daemon control plane: versioned protobuf over Unix domain sockets
// (named pipes on Windows), length-delimited frames, no gRPC (decision R1).
// Every request is idempotent wherever retries exist; every frame carries
// a request id so responses and pushed events can interleave on one socket.
syntax = "proto3";

package clipmill.ipc.v1;

import "clipmill/ipc/v1/ping.proto";
import "clipmill/worker/v1/worker.proto";

// One request frame. request_id is client-chosen and echoed back.
message Request {
  string request_id = 1;
  oneof body {
    PingRequest ping = 10;
    HealthRequest health = 11;
    CreateProjectRequest create_project = 12;
    GetProjectRequest get_project = 13;
    ListProjectsRequest list_projects = 14;
    DeleteProjectRequest delete_project = 15;
    SubmitJobRequest submit_job = 16;
    SubscribeTaskEventsRequest subscribe_task_events = 17;
    GetDeviceProfileRequest get_device_profile = 18;
    GetJobRequest get_job = 19;
    ListJobsRequest list_jobs = 20;
    CancelJobRequest cancel_job = 21;
    RegisterSourceRequest register_source = 22;
    GetSourceRequest get_source = 23;
    ListSourcesRequest list_sources = 24;
    CreateEditDocRequest create_edit_doc = 25;
    ApplyEditCommandRequest apply_edit_command = 26;
    GetEditDocRequest get_edit_doc = 27;
    SnapshotEditDocRequest snapshot_edit_doc = 28;
    ReadArtifactRequest read_artifact = 29;
    ResolveMediaRequest resolve_media = 30;
    GetStorageStatsRequest get_storage_stats = 31;
    SolveCropPathRequest solve_crop_path = 32;
    DirectClipRequest direct_clip = 33;
    SetClipDecisionRequest set_clip_decision = 34;
    ListClipDecisionsRequest list_clip_decisions = 35;
    GetPreviewPlanRequest get_preview_plan = 36;
    ListEditDocsRequest list_edit_docs = 37;
    PlanExportRequest plan_export = 38;
    ExportClipRequest export_clip = 39;
    ExportArchiveRequest export_archive = 40;
    GetLocalLockRequest get_local_lock = 41;
    GetReadinessRequest get_readiness = 42;
    SubmitExportBatchRequest submit_export_batch = 43;
    ListExportBatchesRequest list_export_batches = 44;
    UpdateExportBatchItemRequest update_export_batch_item = 45;
    StartYoutubeImportRequest start_youtube_import = 46;
    GetYoutubeImportRequest get_youtube_import = 47;
    ListYoutubeImportsRequest list_youtube_imports = 48;
    UpdateYoutubeImportRequest update_youtube_import = 49;
    ConfigureYoutubePublishingRequest configure_youtube_publishing = 50;
    ConnectYoutubeChannelRequest connect_youtube_channel = 51;
    GetYoutubePublishingStatusRequest get_youtube_publishing_status = 52;
    UpdateYoutubeConnectionRequest update_youtube_connection = 53;
    StartYoutubeUploadRequest start_youtube_upload = 54;
    GetYoutubeUploadRequest get_youtube_upload = 55;
    ListYoutubeUploadsRequest list_youtube_uploads = 56;
    UpdateYoutubeUploadRequest update_youtube_upload = 57;
    PublishYoutubeUploadRequest publish_youtube_upload = 58;
    DraftYoutubeMetadataRequest draft_youtube_metadata = 59;
    ListModelsRequest list_models = 60;
    DownloadModelsRequest download_models = 61;
    CancelModelDownloadRequest cancel_model_download = 62;
    RemoveModelRequest remove_model = 63;
    VerifyModelRequest verify_model = 64;
    SetModelChoiceRequest set_model_choice = 65;
    InspectHubModelRequest inspect_hub_model = 66;
    AddCustomModelRequest add_custom_model = 67;
    ForgetModelRequest forget_model = 68;
    CleanStorageRequest clean_storage = 69;
    RenameProjectRequest rename_project = 70;
    PreviewCaptionsRequest preview_captions = 71;
    ListEditHistoryRequest list_edit_history = 72;
    ListFacesRequest list_faces = 73;
    PreviewDirectRequest preview_direct = 74;
    ThumbnailFramingRequest thumbnail_framing = 75;
    ImportAssetRequest import_asset = 76;
    ListAssetsRequest list_assets = 77;
    ResolveAssetRequest resolve_asset = 78;
  }
}

// One response frame. Either the matching response body or an error.
// TaskEvent frames are pushed with the subscription's request_id.
message Response {
  string request_id = 1;
  oneof body {
    Error error = 9;
    PingResponse ping = 10;
    HealthResponse health = 11;
    CreateProjectResponse create_project = 12;
    GetProjectResponse get_project = 13;
    ListProjectsResponse list_projects = 14;
    DeleteProjectResponse delete_project = 15;
    SubmitJobResponse submit_job = 16;
    TaskEvent task_event = 17;
    GetDeviceProfileResponse get_device_profile = 18;
    GetJobResponse get_job = 19;
    ListJobsResponse list_jobs = 20;
    CancelJobResponse cancel_job = 21;
    SubscribeTaskEventsResponse subscribe_task_events = 22;
    RegisterSourceResponse register_source = 23;
    GetSourceResponse get_source = 24;
    ListSourcesResponse list_sources = 25;
    CreateEditDocResponse create_edit_doc = 26;
    ApplyEditCommandResponse apply_edit_command = 27;
    GetEditDocResponse get_edit_doc = 28;
    SnapshotEditDocResponse snapshot_edit_doc = 29;
    ReadArtifactResponse read_artifact = 30;
    ResolveMediaResponse resolve_media = 31;
    GetStorageStatsResponse get_storage_stats = 32;
    SolveCropPathResponse solve_crop_path = 33;
    DirectClipResponse direct_clip = 34;
    SetClipDecisionResponse set_clip_decision = 35;
    ListClipDecisionsResponse list_clip_decisions = 36;
    GetPreviewPlanResponse get_preview_plan = 37;
    ListEditDocsResponse list_edit_docs = 38;
    PlanExportResponse plan_export = 39;
    ExportClipResponse export_clip = 40;
    ExportArchiveResponse export_archive = 41;
    GetLocalLockResponse get_local_lock = 42;
    GetReadinessResponse get_readiness = 43;
    ExportBatchResponse export_batch = 44;
    ListExportBatchesResponse list_export_batches = 45;
    YoutubeImportResponse youtube_import = 46;
    ListYoutubeImportsResponse list_youtube_imports = 47;
    YoutubePublishingStatusResponse youtube_publishing_status = 48;
    YoutubeConnectResponse youtube_connect = 49;
    YoutubeUploadResponse youtube_upload = 50;
    ListYoutubeUploadsResponse list_youtube_uploads = 51;
    DraftYoutubeMetadataResponse draft_youtube_metadata = 52;
    // Every model-library request answers with the library as it now stands.
    ListModelsResponse model_library = 53;
    InspectHubModelResponse inspect_hub_model = 54;
    CleanStorageResponse clean_storage = 55;
    RenameProjectResponse rename_project = 56;
    PreviewCaptionsResponse preview_captions = 57;
    ListEditHistoryResponse list_edit_history = 58;
    ListFacesResponse list_faces = 59;
    GetPreviewPlanResponse preview_direct = 60;
    ThumbnailFramingResponse thumbnail_framing = 61;
    ImportAssetResponse import_asset = 62;
    ListAssetsResponse list_assets = 63;
    ResolveAssetResponse resolve_asset = 64;
  }
}

message Error {
  ErrorCode code = 1;
  string message = 2;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_ARGUMENT = 1;
  ERROR_CODE_NOT_FOUND = 2;
  ERROR_CODE_CONFLICT = 3;
  ERROR_CODE_UNAVAILABLE = 4;
  ERROR_CODE_POLICY_DENIED = 5;
  ERROR_CODE_INTERNAL = 6;
}

message HealthRequest {}

message HealthResponse {
  string daemon_version = 1;
  // Wall-clock start time of the daemon process (project/runtime state may
  // carry wall time; artifact identity never does).
  uint64 started_unix_millis = 2;
  bool local_lock = 3;
}

// ---- Project state (small, mutable, user-authored; SQLite, ch. 10) ----

message Project {
  string project_id = 1;
  string name = 2;
  uint64 created_unix_millis = 3;
}

message CreateProjectRequest {
  string name = 1;
}

message CreateProjectResponse {
  Project project = 1;
}

message GetProjectRequest {
  string project_id = 1;
}

message GetProjectResponse {
  Project project = 1;
}

message ListProjectsRequest {}

message ListProjectsResponse {
  repeated Project projects = 1;
}

message DeleteProjectRequest {
  string project_id = 1;
}

message DeleteProjectResponse {}

// Give a project a new name. The name follows the same rules as a new one.
message RenameProjectRequest {
  string project_id = 1;
  string name = 2;
}

message RenameProjectResponse {
  Project project = 1;
}

// ---- Jobs and task events ----

message SubmitJobRequest {
  string project_id = 1;
  // Job kind, e.g. "demo-dag" (Phase 0), later "analyze", "render".
  string kind = 2;
  bytes payload = 3;
}

// Versioned deterministic fixture payload used by W4 and later by the echo
// worker. SubmitJobRequest.payload contains the encoded message.
message DemoDagPayloadV1 {
  string key_version = 1;
  bytes seed = 2;
}

// Versioned payload for the daemon-owned probe/source-map stage. Local paths
// never travel in job payloads; source_id resolves an immutable observation.
message ProbeSourcePayloadV1 {
  string key_version = 1;
  string source_id = 2;
}

// Versioned payload for the daemon-owned ingest fan-out (book ch. 12): one
// job derives the proxy, PCM renditions, loudness envelope, reference index,
// filmstrip, waveform peaks, and analysis frames, then roots a single fan-in
// ingest manifest. Local paths never travel in job payloads.
message IngestSourcePayloadV1 {
  string key_version = 1;
  string source_id = 2;
}

// Versioned payload for the render compiler (book ch. 17). The render is
// pinned to an immutable edit.ir.v1 snapshot rather than a live document, so
// an edit in progress can never change what a render was asked to produce.
// Rights and AI-use disclosure travel with the request because they are
// attestations the user makes, not facts a renderer can infer.
message RenderClipPayloadV1 {
  string key_version = 1;
  string doc_id = 2;
  // Content address of the edit.ir.v1 snapshot to render.
  string ir_artifact_id = 3;
  // Echoed verbatim into the render manifest, e.g. "own_content".
  string source_attestation = 4;
  repeated string gates_passed = 5;
  // Model work that shaped the footage, e.g. "asr_captions", "reframe".
  // Empty for a hand-authored document, which is the Phase 1 truth.
  repeated string ai_assistance = 6;
  // How the file is encoded. Unset keeps the recording's frame rate at
  // 1080 x 1920, which is what every render did before the choice existed.
  OutputFormatV1 format = 7;
}

// The delivered picture's frame rate and size.
//
// The frame rate defaults to the recording's own: converting 23.976 or 25
// frames a second to 29.97 repeats a frame every few, and pans judder. A
// creator who wants 30 or 60 for a platform says so here.
message OutputFormatV1 {
  // Frames per second as a fraction. A zero numerator keeps the recording's
  // own rate.
  uint32 frame_rate_num = 1;
  uint32 frame_rate_den = 2;
  // The size, named by the height the 9:16 frame has at it: 1920 (1080p),
  // 2560 (1440p) or 3840 (4K). Zero is 1920. A clip in another shape keeps
  // that size's short side: 1080p square is 1080 x 1080, landscape 1920 x 1080.
  uint32 height = 3;
}

// Versioned payload for the speech chain (book ch. 13): voice activity, then
// recognition, then forced alignment, then the assembly that fuses them. The
// request names a source; the daemon resolves it to the 16 kHz rendition
// ingest already produced, because a speech worker's job is to read what was
// decoded once, not to open the original file again.
message TranscribeSourcePayloadV1 {
  string key_version = 1;
  string source_id = 2;
  // BCP 47 primary subtag, or empty to let the recognizer decide.
  string language = 3;
  // Zero leaves each parameter at the daemon's default, so a caller with no
  // opinion does not have to have one.
  SpeechDetectionV1 detection = 4;
}

// Where speech is judged to be. These are the operator-facing knobs: raising
// the threshold transcribes less and risks clipping a quiet sentence, and
// lengthening the minimum silence merges two utterances into one.
message SpeechDetectionV1 {
  double threshold = 1;
  uint64 min_speech_ticks = 2;
  uint64 min_silence_ticks = 3;
  uint64 speech_pad_ticks = 4;
}

// What one stage of the speech chain is asked to do.
//
// Deliberately narrower than the job payload above: this is hashed into the
// stage's artifact key, so anything a stage does not read must not appear
// here. A recognizer payload carrying the voice-activity threshold would make
// re-tuning voice activity invalidate every cached transcript, including the
// ones whose inputs did not change at all.
message SpeechStagePayloadV1 {
  string key_version = 1;
  // The registered task kind this payload belongs to.
  string stage = 2;
  string source_fingerprint = 3;
  // 4 was the 16 kHz rendition's content address. It is gone because the
  // address arrives on the lease now — declared by the plan when this runs
  // standalone, delivered by a dependency inside the analyze DAG. A worker may
  // only open what its lease names, so an address that travelled only in the
  // payload named an artifact the worker was not allowed to read. Keeping it
  // here would also give one observation two keys: inside the DAG the field
  // would have to be empty, because the rendition does not exist yet when the
  // plan is written.
  reserved 4;
  reserved "audio_artifact_id";
  // Exactly one of the following is set, matching `stage`.
  SpeechDetectionV1 detection = 5;
  SpeechRecognitionV1 recognition = 6;
  SpeechAlignmentV1 alignment = 7;
}

message SpeechRecognitionV1 {
  string language = 1;
  // Whether each window may see the previous window's text. False by default:
  // one bad window should not be able to poison the rest of the recording.
  bool conditioned_on_previous = 2;
  // Write what was said, fillers included. Whisper otherwise writes clean
  // text — no "um", no "uh" — which leaves nothing for a filler cut to find.
  // A recognizer that has a way to be asked primes each window with it; one
  // that has none for the language decodes as it always has, and says so.
  bool verbatim = 3;
}

message SpeechAlignmentV1 {
  // Below this, a span is reported unaligned rather than placed. An aligner
  // that always answers is an aligner whose answers cannot be trusted.
  double min_score = 1;
}

// Versioned payload for shot detection (book ch. 13). The request names a
// source; the daemon resolves it to the proxy ingest already derived, because
// a perception worker's job is to read the one decode everything else shares,
// not to open the original file again.
message DetectShotsPayloadV1 {
  string key_version = 1;
  string source_id = 2;
  // Zero leaves each parameter at the daemon's default, so a caller with no
  // opinion does not have to have one.
  ShotDetectionV1 detection = 3;
}

// Where the camera is judged to have changed. These are the operator-facing
// knobs: raising the threshold reports fewer cuts and loses the soft ones
// first, and lengthening the minimum shot merges a flash back into the shot
// it interrupted.
message ShotDetectionV1 {
  double threshold = 1;
  uint64 min_shot_ticks = 2;
  // Pixel height every frame is scaled to before comparison. Part of the
  // decision, not an optimisation: the content distance between two frames
  // depends on how much of the sensor noise survived the downscale.
  uint32 analysis_height = 3;
}

// What the shot detector is asked to do.
//
// Narrower than the job payload above, and for the same reason the speech
// stages are: this is hashed into the stage's artifact key, so anything the
// stage does not read must not appear here.
message ShotsStagePayloadV1 {
  string key_version = 1;
  // The registered task kind this payload belongs to.
  string stage = 2;
  string source_fingerprint = 3;
  // 4 was the mezzanine proxy's content address, removed for the same reason
  // the speech stages' audio address was: the lease is what names an artifact a
  // worker may open, so the plan declares it there instead.
  reserved 4;
  reserved "proxy_artifact_id";
  ShotDetectionV1 detection = 5;
  // Build identity of the decoder the worker will be handed, e.g.
  // "ffmpeg-8.1.2-btb-n8.1.2". It belongs in the key because a different build
  // can hand the detector different pixels; the path to it does not, and
  // travels on the lease instead.
  string decoder_bom = 6;
}

// Versioned payload for the evidence index (book ch. 14). The request names a
// source; the daemon resolves it to the transcript already published for it,
// and to the shot detection if there is one. Nothing tunable travels here yet:
// the segmentation parameters are the daemon's, and adding a knob to this
// message later is additive.
message IndexTranscriptPayloadV1 {
  string key_version = 1;
  string source_id = 2;
}

// What the evidence index is asked to read.
//
// The artifacts arrive here rather than through task dependencies because both
// were published by earlier jobs: a task's inputs are the outputs of the tasks
// it depends on, and this job depends on nothing. Content addresses are safe
// in a payload the artifact key hashes — unlike a path, the same address means
// the same bytes on every machine.
message IndexStagePayloadV1 {
  string key_version = 1;
  // The registered task kind this payload belongs to.
  string stage = 2;
  // 3 and 4 were the transcript's and the shot detection's content addresses.
  // Both arrive on the lease now, declared by the plan when this stage runs
  // standalone and delivered by a dependency inside the analyze DAG, so this
  // payload carries only what the stage was asked to do.
  reserved 3, 4;
  reserved "transcript_artifact_id", "shots_artifact_id";
}

// What the editorial windows stage is asked to cut (plan, Milestone 2).
//
// Nothing but its own name: the index and the transcript arrive on the lease
// as the outputs of the tasks it depends on, and the budget the cut is made
// under is the daemon's, recorded in the recipe so that a re-cut under another
// budget is a different artifact.
message EditorialStagePayloadV1 {
  string key_version = 1;
  // The registered task kind this payload belongs to.
  string stage = 2;
  ClipDurationV1 duration = 3;
  // Prompt content digest and decoding policy are part of the recipe key.
  string prompt_digest = 4;
  uint32 max_output_tokens = 5;
  EditorialCloudV1 cloud = 6;
  // interview or scripted; empty reads as interview for older runs.
  string content_profile = 7;
}

// Versioned payload for discovery (book ch. 15). The request names a source;
// the daemon resolves it to the evidence index, the transcript behind it, and
// the loudness envelope if ingest derived one.
message DiscoverCandidatesPayloadV1 {
  string key_version = 1;
  string source_id = 2;
  // Zero leaves the platform range at the daemon's default, so a caller with
  // no opinion about clip length does not have to have one.
  ClipDurationV1 duration = 3;
}

// The clip length the search expands against. A range rather than fixed
// buckets: a clip's right length is a property of the moment, not of a preset.
message ClipDurationV1 {
  uint64 min_ticks = 1;
  uint64 max_ticks = 2;
}

// What the discovery stage is asked to search.
//
// Like the evidence index beside it, the documents arrive as content addresses
// in the payload rather than through dependencies, because all three were
// published by earlier jobs.
message DiscoverStagePayloadV1 {
  string key_version = 1;
  // The registered task kind this payload belongs to.
  string stage = 2;
  // 3, 4, and 5 were the index's, the transcript's, and the loudness
  // envelope's content addresses. They arrive on the lease now, for the reason
  // the evidence index above states.
  reserved 3, 4, 5;
  reserved "index_artifact_id", "transcript_artifact_id", "loudness_artifact_id";
  ClipDurationV1 duration = 6;
  // The fewest nominations each proposer keeps regardless of score. Part of
  // the key: a different floor is a different search.
  uint64 exploration_floor = 7;
}

// Versioned payload for ranking (book ch. 16). The request names a source; the
// daemon resolves it to the candidate set, the index, and the transcript.
message RankCandidatesPayloadV1 {
  string key_version = 1;
  string source_id = 2;
  // Zero leaves the count and the diversity trade-off at the daemon's
  // defaults.
  uint64 count = 3;
  // Thousandths, so the value that reaches an artifact key is an integer.
  uint64 diversity_milli = 4;
}

// What the ranking stage is asked to score.
//
// The three documents are named as content addresses when this runs as a
// standalone job, and left empty when it runs inside the analyze DAG, where
// they arrive as the outputs of the tasks it depends on. The key is computed
// from the addresses either way, so the two routes share a cache entry.
message RankStagePayloadV1 {
  string key_version = 1;
  // The registered task kind this payload belongs to.
  string stage = 2;
  // 3, 4, and 5 were the candidate set's, the index's, and the transcript's
  // content addresses, which arrive on the lease now.
  reserved 3, 4, 5;
  reserved "candidates_artifact_id", "index_artifact_id", "transcript_artifact_id";
  uint64 count = 6;
  uint64 diversity_milli = 7;
}

// Versioned payload for caption derivation (book ch. 19). The request names a
// source; the daemon resolves it to the transcript it must have, and to the
// evidence index and the shot cuts if they exist.
message DeriveCaptionsPayloadV1 {
  string key_version = 1;
  string source_id = 2;
  // The window to caption. Both zero is the transcript's whole coverage, which
  // is what a caller with no clip in mind wants. A cue may not cross either
  // edge, for the same reason it may not cross a cut.
  uint64 span_start_ticks = 3;
  uint64 span_end_ticks = 4;
}

// What the caption stage is asked to segment.
//
// The documents it reads arrive on the lease, so what travels here is only what
// the daemon decided: which window, and under whose key. Both numbers reach the
// artifact key, because captioning a different window is a different answer
// rather than a slice of this one.
message CaptionsStagePayloadV1 {
  string key_version = 1;
  // The registered task kind this payload belongs to.
  string stage = 2;
  uint64 span_start_ticks = 3;
  uint64 span_end_ticks = 4;
}

// Versioned payload for the whole analysis (book ch. 15/16): probe, ingest,
// the speech chain, shot detection, the evidence index, discovery, and
// ranking, planned as one DAG whose single rooted artifact names every stage.
// This is what a new project submits and what evaluation runs.
message AnalyzeSourcePayloadV1 {
  string key_version = 1;
  string source_id = 2;
  // BCP 47 primary subtag, or empty to let the recognizer decide.
  string language = 3;
  // Zero leaves each of these at the daemon's default, so a caller with no
  // opinion does not have to have one.
  ClipDurationV1 duration = 4;
  uint64 count = 5;
  uint64 diversity_milli = 6;
  // Explicit local editorial selection; absent keeps legacy heuristic jobs readable.
  bool local_editorial = 7;
  EditorialCloudV1 cloud_editorial = 8;
  // Persisted editorial rubric; interview (default) or scripted.
  string content_profile = 9;
}

// Explicit consent applies only to this run. Credentials never enter the request.
message EditorialCloudV1 {
  bool transcript_consent = 1;
  uint64 budget_micro_usd = 2;
  // Fixed, versioned adapter policy; unsupported identifiers are rejected.
  string model = 3;
}

// What the fan-in at the end of an analysis is asked to write.
//
// It reads nothing tunable: the document is the list of artifacts its
// dependencies published, and every stage that produced one is a dependency. It
// does carry the stages the plan chose not to run, because that is the one fact
// no artifact can state — a recording with no video has no shot cuts, and
// "nobody looked" has to stay distinguishable from "there were none".
message AnalysisStagePayloadV1 {
  string key_version = 1;
  // The registered task kind this payload belongs to.
  string stage = 2;
  string source_fingerprint = 3;
  repeated SkippedStageV1 skipped = 4;
}

// A stage the plan left out, and the property of the source that left it out.
message SkippedStageV1 {
  // The artifact kind that was not produced, e.g. "evidence.shots.v1".
  string kind = 1;
  // "no_video" or "no_audio".
  string reason = 2;
}

// Versioned payload for the daemon-owned device profiler. The stable
// hardware/runtime fingerprint selects the cache lineage; generation makes
// an explicit remeasurement a distinct artifact recipe.
message DeviceProfilePayloadV1 {
  string key_version = 1;
  string hardware_fingerprint = 2;
  uint64 measurement_generation = 3;
}

message SubmitJobResponse {
  string job_id = 1;
  Job job = 2;
}

message SubscribeTaskEventsRequest {
  // Empty subscribes to all projects.
  string project_id = 1;
  // Empty subscribes to all jobs selected by project_id.
  string job_id = 2;
  // Replay durable events strictly after this global event cursor.
  uint64 after_event_id = 3;
}

message SubscribeTaskEventsResponse {
  // Highest durable event present when the subscription was established.
  uint64 current_event_id = 1;
}

// Pushed for every task state transition and heartbeat-driven progress.
message TaskEvent {
  string job_id = 1;
  string task_id = 2;
  TaskState state = 3;
  clipmill.worker.v1.ProgressUnits progress = 4;
  // Resource reason when waiting, e.g. "paused: thermal" (ch. 10).
  string wait_reason = 5;
  uint64 at_unix_millis = 6;
  // Global, durable, monotonically increasing replay cursor.
  uint64 event_id = 7;
  uint32 attempt = 8;
  clipmill.worker.v1.FailureClass failure_class = 9;
}

enum TaskState {
  TASK_STATE_UNSPECIFIED = 0;
  TASK_STATE_PLANNED = 1;
  TASK_STATE_ADMITTED = 2;
  TASK_STATE_RUNNING = 3;
  TASK_STATE_SUCCEEDED = 4;
  TASK_STATE_RETRYABLE = 5;
  TASK_STATE_FAILED = 6;
  TASK_STATE_CANCELLED = 7;
}

message Job {
  string job_id = 1;
  string project_id = 2;
  string kind = 3;
  JobState state = 4;
  uint64 created_unix_millis = 5;
  uint64 updated_unix_millis = 6;
  repeated Task tasks = 7;
  repeated string output_artifact_ids = 8;
  clipmill.worker.v1.FailureClass failure_class = 9;
  string failure_detail = 10;
  // The source the job ran over, or empty for a job that is not about one.
  //
  // The store has always kept this; the wire did not carry it, so a shell
  // holding two recordings in one project could not tell whose analysis a job
  // was and fell back to the newest. Which recording is the one thing a reader
  // of an analysis needs to know first.
  string source_id = 11;
  // What an export job is delivering, read off its own payload; absent for
  // every other kind of job. An export is durable daemon state, and this is
  // what lets a screen find the export of a document again after the screen
  // was left or the application relaunched, rather than remembering it in
  // renderer state that a remount starts without.
  ExportSummaryV1 export = 12;
  // Selected rubric read from this analysis job's persisted payload.
  string content_profile = 13;
  // What an analysis was asked for, read off its own payload; absent for every
  // other kind of job. A retry starts from these rather than from defaults.
  AnalysisSettingsV1 analysis = 14;
}

// The choices an analysis was started with.
message AnalysisSettingsV1 {
  string language = 1;
  uint64 min_ticks = 2;
  uint64 max_ticks = 3;
  uint64 count = 4;
  bool local_editorial = 5;
}

// The identity of an export, as its job carries it.
message ExportSummaryV1 {
  string doc_id = 1;
  // The revision that was rendered.
  uint64 revision = 2;
  // The immutable edit.ir.v1 snapshot it was frozen as.
  string ir_artifact_id = 3;
  // The folder, resolved, the files land in.
  string destination_dir = 4;
}

message Task {
  string task_id = 1;
  string kind = 2;
  TaskState state = 3;
  uint32 attempt = 4;
  uint32 max_attempts = 5;
  clipmill.worker.v1.ProgressUnits progress = 6;
  string wait_reason = 7;
  string output_artifact_id = 8;
  // The artifact kind this task publishes, e.g. "media.filmstrip.v1".
  //
  // Declared when the job was planned, so it is known before the task has run
  // and stays known if it fails. `kind` above names the work; this names the
  // observation, which is what a reader is actually looking for — a shell
  // wanting the filmstrip should ask for the task that produces one rather than
  // learn that the daemon calls that work "ingest-filmstrip".
  string output_kind = 9;
  // When it first started running and when it succeeded, from its own event
  // log; zero until it has. Measured, so a machine's past runs can say how
  // long the next one will take.
  uint64 started_unix_millis = 10;
  uint64 finished_unix_millis = 11;
}

enum JobState {
  JOB_STATE_UNSPECIFIED = 0;
  JOB_STATE_PLANNED = 1;
  JOB_STATE_RUNNING = 2;
  JOB_STATE_SUCCEEDED = 3;
  JOB_STATE_FAILED = 4;
  JOB_STATE_CANCEL_REQUESTED = 5;
  JOB_STATE_CANCELLED = 6;
}

message GetJobRequest {
  string job_id = 1;
}

message GetJobResponse {
  Job job = 1;
}

message ListJobsRequest {
  string project_id = 1;
}

message ListJobsResponse {
  repeated Job jobs = 1;
}

message CancelJobRequest {
  string job_id = 1;
}

message CancelJobResponse {
  Job job = 1;
}

// ---- Immutable local source evidence ----

message Source {
  string source_id = 1;
  string project_id = 2;
  // Local-only control-plane value. It is excluded from fingerprints,
  // artifact recipes, logs, and portable source-map artifacts.
  string absolute_path = 3;
  uint64 byte_size = 4;
  string sample_sha256 = 5;
  string source_fingerprint = 6;
  string source_map_artifact_id = 7;
  uint64 created_unix_millis = 8;
  // The file is no longer at `absolute_path`, or is a different size than
  // when it was registered: moved, renamed, replaced or deleted. Everything
  // made from it still works from the preview copies; an export needs the
  // original back, which relinking restores.
  bool missing = 9;
}

message RegisterSourceRequest {
  string project_id = 1;
  string absolute_path = 2;
  // When set, update this source's path only if the new file has its fingerprint.
  string source_id = 3;
}

message RegisterSourceResponse {
  Source source = 1;
  // True when an unchanged observation avoided another FFprobe invocation.
  bool observation_cache_hit = 2;
  // The probe, inline (clipmill.source_map.v1 JSON).
  //
  // Registering is what probes a file, and the artifact that carries the result
  // is published later by the analysis DAG's first task. So between choosing a
  // file and starting a run there is nothing to read by address, and a shell
  // that wanted to show a duration before asking anyone to commit had no way to
  // learn one. The daemon already holds this; sending it is cheaper than making
  // the shell start a job to find out how long the video is.
  string source_map_json = 3;
}

message GetSourceRequest {
  string source_id = 1;
}

message GetSourceResponse {
  Source source = 1;
  // The stored probe, for hydrating an imported source without another mutation.
  string source_map_json = 2;
}

message ListSourcesRequest {
  string project_id = 1;
}

message ListSourcesResponse {
  repeated Source sources = 1;
}

// ---- Device profile (measured, cached; ch. 11) ----

// Read one published observation document, for a shell that renders it.
//
// The artifact is named by content address and the *kind decides which file* is
// served: every kind on the allowlist carries exactly one document, so there is
// no path here for a caller to point somewhere else inside the object. What may
// be read is a short list of JSON observations — never model weights, never
// media, never a file the daemon did not publish. Media travels over the
// `clipmill-media://` protocol instead, which is a different surface with a
// different allowlist.
//
// The project scopes it. Every artifact a shell legitimately shows was produced
// by a task in one of that project's jobs, so requiring it costs one indexed
// lookup and means a renderer holding one project's id cannot read another's.
message ReadArtifactRequest {
  string project_id = 1;
  string artifact_id = 2;
  // Byte offset into the document. Documents larger than one chunk are read in
  // several calls; `total_bytes` in the response says when to stop.
  uint64 offset = 3;
  // Zero asks for as much as one chunk allows, which is what a caller reading a
  // whole document wants.
  uint64 length = 4;
}

message ReadArtifactResponse {
  string artifact_id = 1;
  // The artifact kind, echoed so a caller can refuse a document it did not ask
  // for rather than parsing it and finding out.
  string kind = 2;
  // The file served, e.g. "ranking.json". Derived from the kind, not requested.
  string path = 3;
  uint64 offset = 4;
  // Size of the whole document, so a caller knows whether it has all of it.
  uint64 total_bytes = 5;
  bytes chunk = 6;
}

// Authorize a media artifact for the `clipmill-media://` protocol, and say what
// it contains.
//
// Media never travels over this socket — a proxy is hundreds of megabytes and a
// player seeks through it, so serving it in frames would be absurd. What travels
// here is the *permission* and the inventory: the daemon checks that the project
// produced the artifact and that its kind is one a shell may stream, then names
// the files it may serve and how large each is. The shell process opens those
// bytes itself, through the same verified store API the daemon uses.
//
// No path leaves the daemon. The shell derives the object directory from the
// content address, exactly as the store does, so a response cannot be turned
// into a pointer at something outside it.
// One of the person's own pictures or sounds — a logo, a music bed — kept by
// the SHA-256 of its bytes. A document names it by that hash.
message AssetV1 {
  // sha256:<hex>
  string hash = 1;
  // image or audio, decided from the bytes, never from a file name.
  string kind = 2;
  // The file name it was imported from.
  string name = 3;
  string media_type = 4;
  uint64 bytes = 5;
  // A picture's size; zero for a sound.
  int64 width = 6;
  int64 height = 7;
  // A sound's length; zero for a picture.
  int64 duration_ticks = 8;
  // own_content, licensed, royalty_free or public_domain.
  string license = 9;
  uint64 added_unix_millis = 10;
}

// Copy a file the person chose into the asset folder. The same bytes twice
// are one asset.
message ImportAssetRequest {
  string path = 1;
  string license = 2;
}

message ImportAssetResponse {
  AssetV1 asset = 1;
}

// Every asset, newest first; `kind` narrows it to pictures or sounds.
message ListAssetsRequest {
  string kind = 1;
}

message ListAssetsResponse {
  repeated AssetV1 assets = 1;
}

// Whether a hash is one of the assets, and how to serve it. A host derives
// the file from the hash; it receives no path.
message ResolveAssetRequest {
  string hash = 1;
}

message ResolveAssetResponse {
  string hash = 1;
  string media_type = 2;
  uint64 bytes = 3;
}

message ResolveMediaRequest {
  string project_id = 1;
  string artifact_id = 2;
}

message ResolveMediaResponse {
  string artifact_id = 1;
  string kind = 2;
  // Every file this artifact may serve, and nothing else. A request for a name
  // absent from this list is refused by the protocol without touching disk.
  repeated MediaFileV1 files = 3;
}

message MediaFileV1 {
  // Path inside the artifact, e.g. "proxy.mp4".
  string path = 1;
  uint64 bytes = 2;
  // What to answer with, e.g. "video/mp4". Stated by the daemon rather than
  // guessed from the extension by the process doing the serving.
  string media_type = 3;
}

// What this installation is using on disk, by category.
//
// Categories rather than one number, because the three answers a user acts on
// are different actions: artifacts are re-derivable and can be collected, model
// weights are expensive to re-download and should not be, and state is small and
// must not be touched. A single total would tell nobody what to do about it.
//
// Paths travel with the sizes. Phase 0 deliberately withheld them — no screen
// then had a use for one — but Settings is the screen whose business it is:
// "your artifacts are 40 GB" is not actionable until a user can go and look.
message GetStorageStatsRequest {}

message GetStorageStatsResponse {
  repeated StorageCategoryV1 categories = 1;
  // Free space on the volume holding the data directory, as the filesystem
  // reports it to this process. Zero when it could not be determined, which a
  // caller must distinguish from a genuinely full disk.
  uint64 available_bytes = 2;
  // False when the figure above could not be read at all.
  bool available_known = 3;
  // How long an unreferenced artifact is kept before collection may take it.
  // Displayed rather than adjustable in Phase 1: the number is real, and a
  // control that changed it would need a collection policy nobody has written.
  uint64 retention_grace_seconds = 4;
  // Generated files nothing references — no project, source, task or system
  // root reaches them — which a clean-up would remove now instead of waiting
  // out the retention period. An estimate from the catalogue in memory; the
  // clean-up itself re-verifies every reference before deleting anything.
  uint64 reclaimable_bytes = 5;
  uint64 reclaimable_items = 6;
  bool reclaimable_known = 7;
}

message StorageCategoryV1 {
  // Stable identifier: "artifacts", "models", "state", "imports", "backups"
  // or "temporary". A caller chooses its own wording; this is what it keys
  // off. "state" excludes the backups and scratch reported beside it.
  string key = 1;
  uint64 bytes = 2;
  // How many things were counted — published objects for artifacts, files for
  // the rest.
  uint64 items = 3;
  // Where this category lives, absolute. Shown so a number is somewhere a user
  // can go, not so anything can be written there.
  string path = 4;
}

// ---- Faces and reframing (book ch. 18) ----

// The knobs a face pass is judged on. Raising the score threshold finds fewer
// faces and loses the turned-away ones first; the two association overlaps are
// the difference between a track that survives a head turn and one that ends
// and restarts under a new id, which is what would make the camera cut to
// itself.
message FaceDetectionV1 {
  double score_threshold = 1;
  double nms_iou = 2;
  // Overlap at which a confident detection continues a track, and the lower
  // one at which a weak detection may recover a track it would not be allowed
  // to start.
  double match_iou = 3;
  double recover_iou = 4;
  // Frames a track may go unmatched before it closes, and the shortest track
  // worth publishing.
  uint32 max_gap_frames = 5;
  uint32 min_track_frames = 6;
}

// Submit a face pass over a source whose frames have already been sampled.
message DetectFacesPayloadV1 {
  string key_version = 1;
  string source_id = 2;
  // Zero leaves each parameter at the daemon's default, so a caller with no
  // opinion does not have to have one.
  FaceDetectionV1 detection = 3;
}

// What the face detector is asked to do.
//
// Narrower than a job payload, and for the reason every stage payload is: this
// is hashed into the stage's artifact key, so anything the stage does not read
// must not appear here. The frames it reads arrive on the lease.
message FacesStagePayloadV1 {
  string key_version = 1;
  // The registered task kind this payload belongs to.
  string stage = 2;
  string source_fingerprint = 3;
  FaceDetectionV1 detection = 4;
}

// Solve a virtual camera path for one span, against one face-track artifact.
//
// Not a job: the answer is wanted while somebody is looking at a clip, it is
// microseconds of arithmetic over evidence that already exists, and it produces
// a *proposal* rather than an artifact. Nothing it returns is written anywhere —
// the caller decides whether the proposal becomes part of an edit, which is why
// re-solving after a nudge costs nothing and changes nothing.
message SolveCropPathRequest {
  string project_id = 1;
  // The face tracks to follow. The project must have published it, checked the
  // same way every other artifact read is.
  string face_track_artifact_id = 2;
  // The span to solve over, in ticks. A clip, normally.
  uint64 start_ticks = 3;
  uint64 end_ticks = 4;
  // Output aspect as a ratio, e.g. 9:16. The crop is the largest rectangle of
  // this shape that fits inside the source frame.
  uint32 aspect_width = 5;
  uint32 aspect_height = 6;
  // Zero leaves each weight at the daemon's default, which is what a caller
  // with no opinion should send.
  CropWeightsV1 weights = 7;
  // Follow this face instead of the one the focus gate would choose. A person
  // picked it, so it only has to be seen in the span: the presence bar that
  // keeps the automatic camera off an empty chair is theirs to overrule.
  uint32 track_id = 8;
  bool follow_track = 9;
  // Solve the two-person layout instead: the pair the two-up gate finds, each
  // in its own half of the frame — stacked, the left-hand face on top, or
  // side by side for a landscape aspect. Refused, with a reason, when two
  // people are not both clearly in the span.
  bool two_up = 10;
}

// The objective's terms, per ch. 18. Every one of them exists to prevent
// chasing — the failure users punish hardest is not a static miscrop but a
// camera lurching at every detection flicker — and the acceleration weight does
// the heaviest lifting.
message CropWeightsV1 {
  // Keeping the subject inside the crop.
  double subject = 1;
  // Velocity and acceleration damping, which is what makes the move read as a
  // human operator rather than a tracker.
  double velocity = 2;
  double acceleration = 3;
  // Zoom damping, so the frame does not breathe.
  double zoom = 4;
  // Largest camera speed the solver may plan, in frame-widths per second.
  // Normalized so behaviour does not change with resolution.
  double max_speed_per_second = 5;
}

message SolveCropPathResponse {
  // Sparse keyframes: the path is linear between them, and a still camera is
  // two. Empty when the solver declined, in which case `fit` says so.
  repeated CropKeyframeV1 keyframes = 1;
  // True when no track was worth following and the answer is the fitted frame
  // rather than a solved path. A reason is always present with it, because
  // "why is this not tracking" is the first thing anyone asks.
  bool fit = 2;
  string fit_reason = 3;
  // The track the camera followed, when it followed one.
  uint32 track_id = 4;
  bool has_track = 5;
  // What the solve is worth: the share of frames in which the followed face
  // stayed inside the crop. Reported rather than asserted — a path can be
  // optimal and still fail to contain a subject that left.
  double containment = 6;
  // With `two_up`: the lower portrait's path and the face it follows. The
  // upper portrait's are `keyframes` and `track_id`.
  repeated CropKeyframeV1 secondary_keyframes = 7;
  uint32 secondary_track_id = 8;
}

// The faces the detector saw over a span, for a shell to draw over the whole
// frame so a person can pick who the camera follows.
//
// Read from a published face track and checked the way every artifact read
// is. Like SolveCropPath it is a proposal surface: nothing is written.
message ListFacesRequest {
  string project_id = 1;
  string face_track_artifact_id = 2;
  // Source ticks, half-open. A clip's section, normally.
  uint64 start_ticks = 3;
  uint64 end_ticks = 4;
}

message ListFacesResponse {
  // Every box in the span, bridged ones included, in track then time order.
  repeated FaceSightingV1 sightings = 1;
}

// One face in one sampled frame, as shares of the source's display frame.
message FaceSightingV1 {
  uint32 track_id = 1;
  uint64 t_ticks = 2;
  double x = 3;
  double y = 4;
  double width = 5;
  double height = 6;
}

// One point on the virtual camera path. Centre and scale, both normalized
// against the source frame, so the same path drives any resolution.
message CropKeyframeV1 {
  uint64 t_ticks = 1;
  // Centre of the crop, in [0,1] of the source frame.
  double center_x = 2;
  double center_y = 3;
  // Height of the crop as a share of the source height; width follows the
  // requested aspect.
  double scale = 4;
}

message GetDeviceProfileRequest {
  // Force a fresh measurement instead of the cached artifact.
  bool remeasure = 1;
}

message GetDeviceProfileResponse {
  // Content address of the device_profile artifact.
  string artifact_id = 1;
  // The profile document itself (clipmill.device_profile.v1 JSON), inlined
  // for shells that do not read the artifact store directly.
  string profile_json = 2;
}

// ---- Edit documents (the Edit IR, ch. 17) ----
//
// The live document and its command log are project state (SQLite, single
// writer). Renders read an immutable `edit.ir.v1` snapshot artifact instead,
// so an edit in progress can never change what a render was asked to produce.

message EditDoc {
  string doc_id = 1;
  string project_id = 2;
  // Number of commands applied; also the command log's high-water mark.
  uint64 revision = 3;
  // The clipmill.edit_ir.v1 document as canonical JSON.
  string document_json = 4;
  uint64 created_unix_millis = 5;
  uint64 updated_unix_millis = 6;
  // Where the document came from: the source it was cut from and the candidate
  // the director built it for. Both empty for a document handed in whole by
  // CreateEditDoc, which names no candidate.
  //
  // This is what makes a document findable by the clip it is, rather than only
  // by its position in a list. "The newest document" is the wrong answer to
  // "which document is this clip's" the moment a project holds two.
  string source_id = 7;
  string candidate_id = 8;
  // The analysis run the clip was cut from, when the director knew it. The
  // candidate id is minted by a run, and the captions, boundaries and face
  // tracks a document was built from are that run's — so a screen reopening
  // it can read the same run rather than whichever one is newest.
  string job_id = 9;
}

message CreateEditDocRequest {
  string project_id = 1;
  // Initial document. Empty starts from the empty document.
  string document_json = 2;
  // Which clip the document is, when the caller knows: a document handed in
  // whole may still be a clip of a recording, and naming it lets a later
  // direction of the same clip reopen it rather than build a second.
  string source_id = 3;
  string candidate_id = 4;
  string job_id = 5;
}

message CreateEditDocResponse {
  EditDoc doc = 1;
}

message ApplyEditCommandRequest {
  string doc_id = 1;
  // The revision the client last observed. A mismatch is reported as a
  // conflict rather than silently rebasing someone else's edit.
  uint64 expected_revision = 2;
  string command_json = 3;
}

message ApplyEditCommandResponse {
  EditDoc doc = 1;
  // The command that undoes this one. The daemon keeps no undo stack; it
  // hands back the inverse and durably logs it beside the command.
  string inverse_command_json = 2;
}

message GetEditDocRequest {
  string doc_id = 1;
}

message GetEditDocResponse {
  EditDoc doc = 1;
}

message SnapshotEditDocRequest {
  string doc_id = 1;
}

message SnapshotEditDocResponse {
  // Content address of the edit.ir.v1 artifact the renderer consumes.
  string artifact_id = 1;
  // Revision the snapshot froze.
  uint64 revision = 2;
}

// What somebody decided about a candidate. Kept in the durable store rather
// than in the interface, because rejecting a clip is work nobody remembers
// doing and therefore work nobody can redo.
enum ClipDecisionV1 {
  CLIP_DECISION_V1_UNSPECIFIED = 0;
  // Not this one. A decision rather than a deletion, so a re-run does not put
  // it back in front of somebody who already said no.
  CLIP_DECISION_V1_REJECTED = 1;
  // Maybe later.
  CLIP_DECISION_V1_KEPT = 2;
  // Send it to the editor.
  CLIP_DECISION_V1_APPROVED = 3;
}

message SetClipDecisionRequest {
  string project_id = 1;
  string source_id = 2;
  string candidate_id = 3;
  ClipDecisionV1 decision = 4;
}

message SetClipDecisionResponse {
  ClipDecisionV1 decision = 1;
  uint64 decided_unix_millis = 2;
}

message ListClipDecisionsRequest {
  string project_id = 1;
  string source_id = 2;
}

message ClipDecisionRecordV1 {
  string candidate_id = 1;
  ClipDecisionV1 decision = 2;
  uint64 decided_unix_millis = 3;
}

message ListClipDecisionsResponse {
  repeated ClipDecisionRecordV1 decisions = 1;
}

// Which cut the director should build from.
enum ClipCutV1 {
  CLIP_CUT_V1_UNSPECIFIED = 0;
  // What the boundary optimizer chose.
  CLIP_CUT_V1_CHOSEN = 1;
  // Its runner-up, which the Inspector offers one click away.
  CLIP_CUT_V1_ALTERNATIVE = 2;
  // A pair the user put there. Snapped to the candidate's lattice by the
  // daemon before anything is built from it, because a boundary arriving over
  // this socket has been through a process the director does not control.
  CLIP_CUT_V1_EXACT = 3;
}

// Turn an approved candidate into an edit document (book ch. 17).
//
// This creates the document as well as assembling it, so the reply is the same
// EditDoc CreateEditDoc returns and the caller has one round trip rather than
// two with a window in between where a half-approved clip exists.
message DirectClipRequest {
  string project_id = 1;
  string source_id = 2;
  string candidate_id = 3;
  ClipCutV1 cut = 4;
  // Empty takes the caption engine's default preset.
  string style_ref = 5;
  // Read only when cut is EXACT.
  uint64 start_ticks = 6;
  uint64 end_ticks = 7;
  // False reopens the document this candidate already has, if it has one,
  // rather than building a second; edits made to it since are kept. True
  // builds a new document beside the existing one — a variation, asked for on
  // purpose. Approving a clip twice is the first; taking a different cut of it
  // is the second.
  bool variation = 8;
  // Record the approval in the same transaction as the document. A decision
  // written first and a document that then failed to build would leave a clip
  // the board calls approved and the editor cannot open; one write leaves
  // either both or neither.
  bool approve = 9;
  // The analysis run the candidate belongs to. Every stage the director reads
  // — candidates, ranking, transcript, index, shots, faces — is taken from
  // this run, as one snapshot, rather than each from whichever run published
  // it last: a re-analysis that renumbered the candidates, or one still half
  // published, must not be mixed into a clip chosen from another. Empty takes
  // the newest run over the source, checked for coherence the same way.
  string job_id = 10;
  // Explicit human override for a declined nomination; never implied by bulk approval.
  bool allow_declined = 11;
  // Explicit user-selected source interval, without an editorial recommendation.
  // Requires a named run and start/end ticks; candidate_id is ignored.
  bool manual_span = 12;
  // Separately override the caption look's spoken-word highlight.
  optional bool highlight_spoken_word = 13;
  // The clip-wide caption options the document starts with — a saved style's
  // font, colours and highlight — as the edit IR's JSON. Empty keeps the
  // look's own. Checked like any edit: options the IR refuses are refused.
  string caption_options_json = 14;
  // The brand a saved kit starts the clip with — a progress bar, a logo — as
  // the edit IR's JSON. A logo whose picture is not in the asset folder is
  // left out rather than refusing the clip.
  string brand_json = 15;
  // The frame the clip is framed for: vertical, portrait, square or
  // landscape. Empty is vertical.
  string shape = 16;
}

message DirectClipResponse {
  EditDoc doc = 1;
  // Where the cut actually landed, which is not where it was asked for when
  // the request named a boundary the lattice had to move. For a reopened
  // document this is where its segment stands now, trims included.
  uint64 start_ticks = 2;
  uint64 end_ticks = 3;
  // Why the director did what it did, carried out so the interface can say so
  // without re-deriving it from the document.
  repeated string decisions = 4;
  // True when `doc` already existed and was handed back unchanged rather than
  // built by this call.
  bool reopened = 5;
}

// What the editor's player must draw (book ch. 17).
//
// The player applies this plan and computes nothing: there is one interpreter,
// and it is the one that renders. A preview that worked out its own crop
// rectangles or its own karaoke timing would be a second implementation of the
// same arithmetic, and two implementations are two answers waiting to differ on
// a frame nobody checked.
message GetPreviewPlanRequest {
  string project_id = 1;
  string doc_id = 2;
}

// A crop rectangle in source pixels, exactly as the encoder will apply it.
message PreviewCropV1 {
  int64 x = 1;
  int64 y = 2;
  int64 width = 3;
  int64 height = 4;
  // False where the layout is fit and the whole picture is shown, which is a
  // different statement from a crop that happens to cover everything.
  bool present = 5;
}

message PreviewWordV1 {
  string text = 1;
  // Centiseconds this word holds the highlight, from the sweep the burned-in
  // track is written with.
  int64 hold_centis = 2;
  // The word's identity, shared with the same word in the reading cues. A
  // correction is addressed to this rather than to a cue and an index, so it
  // lands in both presentations. Empty only for a document that predates
  // word identities and has not been migrated.
  string word_id = 3;
}

message PreviewLineV1 {
  repeated PreviewWordV1 words = 1;
}

message PreviewCueV1 {
  string cue_id = 1;
  int64 first_frame = 2;
  int64 end_frame = 3;
  string region = 4;
  bool karaoke = 5;
  int64 lead_in_centis = 6;
  // Already broken. The player must not re-wrap, for the same reason libass is
  // told not to.
  repeated PreviewLineV1 lines = 7;
  // Exact display bounds for edits; frame rounding must not retime a cue.
  int64 start_ticks = 8;
  int64 end_ticks = 9;
  // The cue's centre in thousandths of the frame, when it was placed by hand
  // (its own position, or the clip-wide one). Unplaced cues sit in `region`.
  bool positioned = 10;
  uint32 position_x = 11;
  uint32 position_y = 12;
}

message PreviewGainV1 {
  int64 frame = 1;
  double gain_db = 2;
}

// A progress bar as the render draws it: its colour, edge and thickness in
// output pixels. It fills from the left as the program plays.
message PreviewProgressV1 {
  string colour = 1;
  // top or bottom.
  string edge = 2;
  int64 thickness = 3;
}

// Music as the render mixes it: which sound, from where in it, and its level
// in decibels at frames through the program, to interpolate between.
message PreviewMusicV1 {
  string asset = 1;
  int64 offset_ticks = 2;
  repeated PreviewGainV1 levels = 3;
}

// A logo as the render draws it: which asset, which corner, its longer side
// and its distance from the corner's two edges, in output pixels.
message PreviewLogoV1 {
  string asset = 1;
  // top_left, top_right, bottom_left or bottom_right.
  string corner = 2;
  int64 side = 3;
  int64 inset_x = 4;
  int64 inset_y = 5;
  // In percent.
  uint32 opacity = 6;
}

// A text laid over the program, for the editor to show, select and move. Its
// pixels come from the plan's script, which draws it as the render will.
message PreviewOverlayV1 {
  string overlay_id = 1;
  int64 start_ticks = 2;
  int64 end_ticks = 3;
  int64 first_frame = 4;
  int64 end_frame = 5;
  string text = 6;
  // hook or label.
  string role = 7;
  // Its centre, per mille of the frame's width and height.
  uint32 x = 8;
  uint32 y = 9;
  // Its size at the 1920-pixel design height.
  uint32 size = 10;
  string colour = 11;
  // The plate behind it; empty draws an outline.
  string plate = 12;
}

// One segment of the program, and where in the source it plays.
//
// This is the mapping the player used to lack. A clip cut from ten minutes
// into a recording starts at program frame zero and source tick 54,000,000;
// a player that handed the media element program seconds seeked to the
// recording's opening instead. Every seek, scrub and trim goes through these
// numbers now, and the arithmetic is the document's own `program_to_source`.
message PreviewSegmentV1 {
  string segment_id = 1;
  string source_fingerprint = 2;
  // Source ticks the segment plays, half-open.
  int64 in_ticks = 3;
  int64 out_ticks = 4;
  // Where it sits on the program timeline, in ticks and in frames.
  int64 program_start_ticks = 5;
  int64 first_frame = 6;
  int64 end_frame = 7;
  // Both saved viewport paths remain available even when displaying Fit.
  bool has_two_up_paths = 8;
  string framing_warning = 9;
  // How the section is drawn — fit, speaker_fill, two_up or
  // picture_in_picture — and the render's own geometry for it, in output
  // pixels, so a player draws what the export will rather than working it out.
  string layout = 10;
  // Two viewports: the first one's length along the split — its height when
  // stacked, its width side by side in a landscape frame.
  int64 upper_height = 11;
  // Picture in picture: the inset's square.
  bool has_inset = 12;
  int64 inset_x = 13;
  int64 inset_y = 14;
  int64 inset_side = 15;
  // A fitted picture's fill: empty for the picture blurred, or #RRGGBB.
  string background_colour = 16;
  // A fitted picture's zoom past fitting, in percent; 100 fits.
  uint32 zoom_percent = 17;
}

// A source the program draws from, as the crops are measured against it.
message PreviewSourceV1 {
  string source_fingerprint = 1;
  string source_id = 2;
  // Display dimensions: the frame the crop rectangles are in. A transform
  // built against the output's dimensions instead was right only for a
  // source that happened to share its aspect.
  int64 display_width = 3;
  int64 display_height = 4;
}

// The proxy a source is previewed from, and how its clock relates to the
// source's. Proxy second zero is `coverage_start_ticks` of the source.
message PreviewProxyV1 {
  string source_fingerprint = 1;
  string artifact_id = 2;
  // The container inside the artifact, served over the media protocol.
  string file = 3;
  int64 coverage_start_ticks = 4;
  int64 coverage_end_ticks = 5;
  int64 width = 6;
  int64 height = 7;
  uint32 rate_num = 8;
  uint32 rate_den = 9;
}

// Resolved export preset. Colours are CSS #RRGGBBAA, dimensions in output pixels.
message PreviewCaptionStyleV1 {
  string style_ref = 1;
  string font_family = 2;
  uint32 font_size = 3;
  string spoken = 4;
  string unspoken = 5;
  string outline = 6;
  string shadow = 7;
  uint32 outline_width = 8;
  uint32 shadow_depth = 9;
  bool bold = 10;
  bool boxed = 11;
  uint32 margin_horizontal = 12;
  uint32 margin_vertical = 13;
  // The colour key words are set in.
  string accent = 14;
  // How the spoken word is marked: fill, word, box, pop or underline.
  string highlight = 15;
}

// One caption typeface, and whether this installation has its pinned file.
message CaptionFontV1 {
  // The font's own family name, which a caption style names.
  string family = 1;
  // What a person picks it by.
  string label = 2;
  // The pinned file, served to the player so it draws with the same face.
  string file = 3;
  bool installed = 4;
}

// A duration-preserving blend of an outgoing still and live incoming video.
// Outgoing alpha = (end_frame - frame) / (end_frame - first_frame), for
// first_frame <= frame < end_frame. Captions are drawn after this blend.
message PreviewTransitionV1 {
  string incoming_segment_id = 1;
  int64 outgoing_frame = 2;
  int64 first_frame = 3;
  int64 end_frame = 4;
}

message GetPreviewPlanResponse {
  // The revision this plan describes. A caller holding a document at a
  // different revision is looking at a stale picture and can tell.
  uint64 revision = 1;
  uint32 rate_num = 2;
  uint32 rate_den = 3;
  int64 frame_count = 4;
  // One per frame of the program, in order.
  repeated PreviewCropV1 crops = 5;
  repeated PreviewCueV1 cues = 6;
  repeated PreviewGainV1 gain = 7;
  // The output frame the crops are fitted into.
  int64 width = 8;
  int64 height = 9;
  // The program's segments, in order, each mapped to its source.
  repeated PreviewSegmentV1 segments = 10;
  // Every source the segments name, with the frame the crops are measured in.
  repeated PreviewSourceV1 sources = 11;
  // The proxy for each source that has one. A source with no proxy is listed
  // above and absent here, and the player says there is nothing to play.
  repeated PreviewProxyV1 proxies = 12;
  // Which of the document's two cue lists `cues` came from: "burn_in" when
  // the document carries a kinetic grouping, "reading" when the reading cues
  // are what gets burned in. A cue-scoped command — split, merge, re-break —
  // must name the list it means, because each list numbers its own cues.
  string presentation = 13;
  // Lower viewport, one per frame. Absent outside a two-person composition.
  // The primary crop fills the top half, this crop fills the bottom half.
  repeated PreviewCropV1 secondary_crops = 14;
  PreviewCaptionStyleV1 caption_style = 15;
  int64 transition_ticks = 16;
  repeated PreviewTransitionV1 transitions = 17;
  // The sidecar grouping and the two numbers the export strip holds it to,
  // so the editor can offer a repair that clears the finding rather than one
  // that trades it for the next: a cue held to the floor is refused if it
  // then crowds its neighbour.
  repeated PreviewCueV1 reading_cues = 18;
  int64 reading_min_duration_ticks = 19;
  int64 reading_min_gap_ticks = 20;
  // The burned-in captions exactly as the export writes them. A player that
  // runs libass draws the pixels the render will burn in from this alone.
  string ass = 21;
  // Every caption typeface, with whether this installation has it.
  repeated CaptionFontV1 fonts = 22;
  // Why the director framed and captioned the clip as it did. Filled for a
  // dry run, whose document is nowhere else to read it from.
  repeated string decisions = 23;
  // Titles and labels over the program, bottom first.
  repeated PreviewOverlayV1 overlays = 24;
  // The progress bar, when the clip has one.
  PreviewProgressV1 progress = 25;
  // The logo, when the clip has one.
  PreviewLogoV1 logo = 26;
  // The music, when the clip has some.
  PreviewMusicV1 music = 27;
}

// Where the camera would point at a few moments, so a board of clips can show
// each as the vertical frame it will have rather than a strip of the source.
// One face track read for all of them; a proposal surface, writing nothing.
message ThumbnailFramingRequest {
  string project_id = 1;
  string face_track_artifact_id = 2;
  // Source ticks, one per thumbnail, each judged over the two seconds after
  // it. At most 500.
  repeated uint64 moments = 3;
}

message ThumbnailFramingResponse {
  // The crop's centre across the source frame, 0..1, one per moment in
  // order: the face the camera would follow, or the middle where it would
  // fit the whole frame.
  repeated double centres = 1;
}

// The clip approving would build, as the Editor's player would draw it: the
// director's document for this request, built and not saved. The Inspector
// shows it, so the clip judged is the clip an approval makes — the same
// sections, framing and captions. Nothing is written and nothing is recorded.
message PreviewDirectRequest {
  // As approval would send it; `approve` and `variation` are ignored.
  DirectClipRequest direct = 1;
}

// The edit documents a project holds, oldest first.
//
// The editor opens the newest, which is the one approving a clip just created.
// Listing exists so that opening the editor in a later session finds the work
// rather than an empty screen.
message ListEditDocsRequest {
  string project_id = 1;
}

message ListEditDocsResponse {
  repeated EditDoc docs = 1;
}

// The burned-in captions a document would have under another caption look,
// computed and not saved: what the editor draws while a person is still
// choosing, so trying a look is not an edit.
message PreviewCaptionsRequest {
  string doc_id = 1;
  // A caption preset; empty keeps the document's own.
  string style_ref = 2;
  // The clip-wide caption options as the edit document stores them, as JSON.
  // Empty keeps the document's own.
  string options_json = 3;
}

message PreviewCaptionsResponse {
  // The ASS the export would burn in with that look.
  string ass = 1;
  uint64 revision = 2;
}

// Every command applied to a document, oldest first, with its inverse: the
// history an editor can show, and undo that outlives the window it was made in.
message ListEditHistoryRequest {
  string doc_id = 1;
}

message EditHistoryEntryV1 {
  // The revision this command produced.
  uint64 revision = 1;
  string command_json = 2;
  string inverse_json = 3;
  uint64 applied_unix_millis = 4;
}

message ListEditHistoryResponse {
  repeated EditHistoryEntryV1 entries = 1;
}

// ---- Export and archive (book ch. 10, ch. 24 Phase 1) ----

// How badly a validation finding wants attention.
//
// Two levels and the line between them is a design decision, not a scale.
// Blocking means the delivered file would be wrong or would not fit; advisory
// means a person might have meant it. The burn-in caption track is what makes
// the distinction real: it runs deliberately hot, so a reading-rate finding
// against it is advice, while the same finding against the accessibility cues
// blocks — those become the SRT and VTT that leave the building.
enum ExportSeverity {
  EXPORT_SEVERITY_UNSPECIFIED = 0;
  EXPORT_SEVERITY_BLOCKING = 1;
  EXPORT_SEVERITY_ADVISORY = 2;
}

message ExportFindingV1 {
  // Stable identifier a surface keys off, e.g. "rights.missing". The wording
  // in `detail` may be improved; this may not.
  string code = 1;
  ExportSeverity severity = 2;
  // One sentence naming the thing and the number, ready to show.
  string detail = 3;
  // The caption cue a `captions.*` finding is about, so a surface can open
  // that cue rather than parse `detail` for it. Empty for every other check.
  string cue_id = 4;
}

message ExportValidationV1 {
  // False when anything blocking was found. Advisories do not stop an export.
  bool passes = 1;
  repeated ExportFindingV1 findings = 2;
}

// What an export is being asked to do, before it is asked to do it.
//
// The same fields as the request that performs one, because a preview that
// took different inputs would be a preview of a different export.
message ExportRequestV1 {
  string doc_id = 1;
  // An absolute path to a local directory the user chose. Network paths are
  // refused: a half-written export over a link that dropped is a corrupt file
  // with a plausible size, and Phase 1 has no way to tell one from the other.
  string destination_dir = 2;
  // Tokens in braces, e.g. "{index}-{clip}". Empty takes the default.
  string naming_pattern = 3;
  // Echoed verbatim into the delivered package, e.g. "own_content".
  string source_attestation = 4;
  // Confirmations the user gave, e.g. "duration_60s".
  repeated string gates_passed = 5;
  // Model work that shaped the footage, e.g. "asr_captions".
  repeated string ai_assistance = 6;
  // Ordinal within this export, one-based, for the {index} token.
  uint32 index = 7;
  // YYYY-MM-DD for the {date} token. Supplied by the caller, because the
  // daemon's naming code reads no clock — a name nobody can reproduce is a
  // name a preview cannot promise.
  string date = 8;
  // The clip's own words for the {clip} token, when it has a title.
  string title = 9;
  // The revision the person reviewed. Set, an export of any other revision
  // is refused as a conflict: planning read the document and submission
  // reads it again, and an edit between the two — another window, a late
  // command — would otherwise deliver a clip nobody looked at. Unset, the
  // current revision is taken, which is what a caller with no review step
  // means.
  optional uint64 expected_revision = 10;
  // Frame rate and size of the delivered picture. Unset is the recording's
  // own frame rate at 1080 x 1920.
  OutputFormatV1 format = 11;
}

// Check an export without performing one. No side effects, no files.
message PlanExportRequest {
  ExportRequestV1 request = 1;
}

message PlanExportResponse {
  ExportValidationV1 validation = 1;
  // The resolved filename stem, which is what the naming preview shows.
  string stem = 2;
  // Every file this export would write, in delivery order. Resolved by the
  // same code that names them, so the preview cannot disagree with the result.
  repeated string file_names = 3;
  uint64 estimated_bytes = 4;
  uint64 available_bytes = 5;
  // False when free space could not be read, which a caller must distinguish
  // from a genuinely full disk.
  bool available_known = 6;
  // The revision this plan was computed over. A caller carries it into the
  // export request as the revision it reviewed.
  uint64 revision = 7;
}

// Perform an export. Refused outright when the strip finds anything blocking,
// with the findings attached, because an export that starts and then stops is
// a folder of partial files.
message ExportClipRequest {
  ExportRequestV1 request = 1;
}

message ExportClipResponse {
  // The job to watch. Its tasks are the render and the delivery, so progress
  // arrives on the task event stream every other long operation uses.
  string job_id = 1;
  // What was frozen: the revision rendered, the immutable edit.ir.v1 snapshot
  // it was frozen as, and the folder — resolved — the files will land in.
  // The delivered package names its files relative to that folder.
  uint64 revision = 2;
  string ir_artifact_id = 3;
  string destination_dir = 4;
}

// Versioned payload for the export job (render, then deliver).
message ExportClipPayloadV1 {
  string key_version = 1;
  ExportRequestV1 request = 2;
  // Content address of the edit.ir.v1 snapshot to render and deliver.
  string ir_artifact_id = 3;
}

// Versioned payload for the delivery stage.
//
// Narrower than the job payload for the reason every stage payload is: this is
// hashed into the stage's key, so anything the stage does not read must not
// appear here. The render it delivers arrives on the lease.
message DeliverExportPayloadV1 {
  string key_version = 1;
  ExportRequestV1 request = 2;
}

// Pack a project's work into a zip that outlives this application (ch. 10).
//
// Media is referenced rather than copied: a project's recordings are three
// orders of magnitude larger than its documents and already exist on the
// user's disk. Every source is still named with its fingerprint, so a reader
// can say which file it is looking for.
message ExportArchiveRequest {
  string project_id = 1;
  string destination_dir = 2;
}

message ExportArchiveResponse {
  // Absolute path of the archive that was written.
  string path = 1;
  // Lower-case hex, matching what the archive index records for its entries.
  string sha256 = 2;
  uint64 bytes = 3;
  uint32 entry_count = 4;
}

// ---- Settings (13 Settings, Phase 1 subset) ----

// Whether this installation is running under the Local Lock, and the evidence.
//
// Read rather than asserted. `engaged` is true when every stage the daemon
// will run declares a local-lock network policy, which is a fact about the
// stage registry rather than a constant somebody typed — a stage added with
// network access turns this false without anyone remembering to.
message LocalLockStatusV1 {
  bool engaged = 1;
  // Stages registered, and how many of them may reach the network. The second
  // number is what makes the first one checkable.
  uint32 stages = 2;
  uint32 network_allowed_stages = 3;
  // Times a task declaring network access has started since this daemon
  // began. Zero is the expected reading, and a counter that can only be zero
  // would not be worth showing — it is here so that a non-zero reading is
  // possible and visible.
  uint64 egress_attempts = 4;
}

message GetLocalLockRequest {}

// ---- Readiness: whether an analysis could run right now ----
//
// An analysis is planned against models the registry pins and workers that
// connect on their own. A missing weight file or a worker fleet nobody
// started used to show as a stage sitting planned forever with nothing to say.
// This is the question a screen asks before submitting, and again while a
// stage waits: what would each stage need, and is it here?
message GetReadinessRequest {}

// One stage an analysis plans, and whether what it needs is present.
message StageReadinessV1 {
  // The task kind, e.g. "speech-asr".
  string stage = 1;
  // The capability it serves, as the registry spells it. Empty for a stage
  // that runs no model.
  string capability = 2;
  // The implementation this device is bound to, e.g. "clipmill-worker-asr@0.1.0".
  string implementation = 3;
  // The registry name of the model it loads, and where it must be.
  string model = 4;
  string backend = 5;
  // Every pinned file of the model is on disk at the size the registry pins.
  // True for a stage that runs no model.
  bool model_present = 6;
  // The pinned files that are not, when any is not.
  repeated string missing_files = 7;
  // A worker that serves this stage is connected right now.
  bool worker_present = 8;
  // Both of the above.
  bool ready = 9;
  // What to do about it, when not ready: one sentence naming the command.
  string remedy = 10;
}

// A worker connected right now, as it registered.
message WorkerPresenceV1 {
  string worker_id = 1;
  string family = 2;
  repeated string capabilities = 3;
  string backend = 4;
  uint64 since_unix_millis = 5;
}

message GetReadinessResponse {
  // Every stage an analysis would plan that needs a model or a worker.
  repeated StageReadinessV1 stages = 1;
  repeated WorkerPresenceV1 workers = 2;
  // The pinned decoder every media stage runs.
  bool decoder_present = 3;
  string decoder_path = 4;
  // Every stage is ready and the decoder is present.
  bool ready = 5;
}

message GetLocalLockResponse {
  LocalLockStatusV1 status = 1;
}

// A durable explicit selection. Every item retains the exact approved request.
message SubmitExportBatchRequest { repeated ExportRequestV1 requests = 1; }
message ListExportBatchesRequest {}
message UpdateExportBatchItemRequest {
  string batch_id = 1;
  uint32 index = 2;
  // retry or cancel. Retry never advances the approved revision.
  string action = 3;
}
message ExportBatchItemV1 {
  // Derived from the saved edit document; available even during recovery.
  string project_id = 7;
  uint32 index = 1;
  ExportRequestV1 request = 2;
  // pending, queued, failed, or cancelled. Queued jobs have their own lifecycle.
  string state = 3;
  uint32 attempt = 4;
  ExportClipResponse queued = 5;
  string error = 6;
}
message ExportBatchV1 {
  string batch_id = 1;
  uint64 created_unix_millis = 2;
  repeated ExportBatchItemV1 items = 3;
}
message ExportBatchResponse { ExportBatchV1 batch = 1; }
message ListExportBatchesResponse { repeated ExportBatchV1 batches = 1; }

// Explicit network acquisition; completed sources use the normal local pipeline.
// No path or downloader credential is accepted from or returned to the renderer.
message YoutubeImportV1 {
  string import_id = 1;
  string project_id = 2;
  string canonical_url = 3;
  string video_id = 4;
  string title = 5;
  // queued, downloading, processing, registering, completed, failed, cancelled, interrupted
  string state = 6;
  uint32 attempt = 7;
  uint64 downloaded_bytes = 8;
  optional uint64 total_bytes = 9;
  string source_id = 10;
  string error_code = 11;
  string error = 12;
  uint64 created_unix_millis = 13;
  uint64 updated_unix_millis = 14;
  string channel = 15;
  // Maximum source height: 360, 720 or 1080. Legacy zero means 1080.
  uint32 max_height = 16;
}
message StartYoutubeImportRequest {
  string project_id = 1;
  string url = 2;
  bool rights_confirmed = 3;
  // Zero preserves the legacy 1080 default; otherwise 360, 720 or 1080.
  uint32 max_height = 4;
}
message GetYoutubeImportRequest { string import_id = 1; }
message ListYoutubeImportsRequest {
  // Empty returns imports in all projects.
  string project_id = 1;
}
message UpdateYoutubeImportRequest {
  string import_id = 1;
  // cancel or retry. Retry increments the durable attempt; never auto-resumes.
  string action = 2;
}
message YoutubeImportResponse { YoutubeImportV1 record = 1; }
message ListYoutubeImportsResponse { repeated YoutubeImportV1 imports = 1; }

// Channel credentials and resumable session URLs are never IPC data.
message ConfigureYoutubePublishingRequest { string client_config_path = 1; }
message ConnectYoutubeChannelRequest {}
message GetYoutubePublishingStatusRequest {}
message UpdateYoutubeConnectionRequest {
  string connection_id = 1;
  // cancel an unfinished connection, or disconnect an established channel.
  string action = 2;
}
message YoutubeConnectionV1 {
  string connection_id = 1;
  string channel_id = 2;
  string title = 3;
  // connecting, connected, interrupted, failed, disconnected.
  string state = 4;
  string error = 5;
  uint64 created_unix_millis = 6;
  uint64 updated_unix_millis = 7;
}
message YoutubePublishingStatusResponse {
  bool configured = 1;
  repeated YoutubeConnectionV1 connections = 2;
  bool available = 3;
}
message YoutubeConnectResponse {
  string connection_id = 1;
  // The trusted desktop host opens this; never store it in renderer state.
  string authorization_url = 2;
}
message YoutubeVideoMetadataV1 {
  string title = 1;
  string description = 2;
  repeated string tags = 3;
  bool made_for_kids = 4;
  bool contains_synthetic_media = 5;
}
message StartYoutubeUploadRequest {
  string export_job_id = 1;
  string connection_id = 2;
  uint64 expected_revision = 3;
  YoutubeVideoMetadataV1 metadata = 4;
  bool rights_confirmed = 5;
}
message GetYoutubeUploadRequest { string upload_id = 1; }
message ListYoutubeUploadsRequest {
  // Empty returns all local publishing operations, including recovery history.
  string project_id = 1;
}
message UpdateYoutubeUploadRequest {
  string upload_id = 1;
  // pause, resume, or reconcile. No action creates a replacement remote video.
  string action = 2;
}
message PublishYoutubeUploadRequest { string upload_id = 1; }
message YoutubeUploadV1 {
  string upload_id = 1;
  string project_id = 2;
  string doc_id = 3;
  uint64 revision = 4;
  string export_job_id = 5;
  string ir_artifact_id = 6;
  string render_artifact_id = 7;
  string connection_id = 8;
  string channel_id = 9;
  string channel_title = 10;
  YoutubeVideoMetadataV1 metadata = 11;
  // queued, verifying, starting, uploading, paused, auth_required, reconciling,
  // completion_uncertain, private, publishing, public, failed.
  string state = 12;
  uint64 acknowledged_bytes = 13;
  uint64 total_bytes = 14;
  string video_id = 15;
  string visibility = 16;
  string error_code = 17;
  string error = 18;
  uint64 created_unix_millis = 19;
  uint64 updated_unix_millis = 20;
}
message YoutubeUploadResponse { YoutubeUploadV1 record = 1; }
message ListYoutubeUploadsResponse { repeated YoutubeUploadV1 uploads = 1; }
message DraftYoutubeMetadataRequest {
  string export_job_id = 1;
  uint64 expected_revision = 2;
  // Empty reads the basic draft. start/status/cancel/retry refer to optional local Qwen writing.
  string generation_action = 3;
  string generation_job_id = 4;
}
message DraftYoutubeMetadataResponse {
  YoutubeVideoMetadataV1 metadata = 1;
  string render_artifact_id = 2;
  uint64 revision = 3;
  // A bounded transcript excerpt from the immutable rendered snapshot.
  string transcript_excerpt = 4;
  string generation_job_id = 5;
  // idle, queued, running, succeeded, failed, cancelled, or unavailable.
  string generation_state = 6;
  string generation_message = 7;
  string model_name = 8;
  // Present only when the generated suggestion is ready; never applies itself.
  YoutubeVideoMetadataV1 generated_metadata = 9;
}

// No request/job/export IDs: identical immutable edits share the model cache.
message YoutubeMetadataTaskPayloadV1 {
  string key_version = 1;
  string ir_artifact_id = 2;
  string prompt_digest = 3;
  uint32 max_output_tokens = 4;
}

// ---- Model library: what can run here, what is installed, and getting it ----
//
// The catalog is the model registry: every model a ClipMill worker knows how
// to run, bundled with the release or pinned by the person from a repository.
// Acquiring one is an explicit network operation the person starts. Every
// file is verified against its pinned SHA-256 before it is installed, the
// Local Lock counts the operation, and nothing is ever fetched automatically.
message ListModelsRequest {}

// One model, and where it stands on this device.
message ModelV1 {
  // Registry name: the identity analyses are keyed against.
  string name = 1;
  string title = 2;
  string summary = 3;
  // The job it does, as the registry spells it: vad, asr, forced-align,
  // editorial or detect-faces.
  string capability = 4;
  string runtime = 5;
  string backend = 6;
  string quantization = 7;
  string license_spdx = 8;
  string source_repo = 9;
  string source_revision = 10;
  // Sum of the pinned files: what a download costs.
  uint64 download_bytes = 11;
  // Weights plus the runtime allowance: what running it needs.
  uint64 memory_bytes = 12;
  // Part of the set a fresh install is offered, on devices that can run it.
  bool recommended = 13;
  // This platform can load the runtime at all.
  bool supported = 14;
  string unsupported_reason = 15;
  // How the memory it needs compares with this device: fits, tight (above
  // the share an analysis may use, within physical memory), too_large, or
  // unknown. A warning, never a refusal.
  string memory_fit = 16;
  // Pinned by the person rather than bundled.
  bool custom = 17;
  // installed, partial or missing, from the pinned sizes on disk.
  string install_state = 18;
  uint64 installed_bytes = 19;
  // Present while queued, downloading or verifying, and after a failed or
  // cancelled attempt until the next one.
  ModelDownloadV1 download = 20;
  // The next analysis plans this model for its job.
  bool in_use = 21;
  // The worker family that runs it. A task planned with this model is only
  // ever handed to a worker of this family, whichever others serve the job.
  string worker = 22;
  // What a person calls that worker, such as "MLX speech worker".
  string worker_title = 23;
  // A worker of that family is connected now.
  bool worker_connected = 24;
}

message ModelDownloadV1 {
  // queued, downloading, verifying, failed or cancelled.
  string state = 1;
  uint64 received_bytes = 2;
  uint64 total_bytes = 3;
  // The file in flight, relative to the model's directory.
  string current_file = 4;
  // One sentence, when the attempt failed.
  string error = 5;
  uint64 updated_unix_millis = 6;
}

// A job an analysis runs, and which model does it.
message ModelJobV1 {
  string capability = 1;
  string title = 2;
  string summary = 3;
  // What the next analysis plans for the job; empty when nothing is registered.
  string model = 4;
  // chosen (the person picked it), measured, portable (the default for an
  // unmeasured device), installed_fallback (the default is not installed),
  // default (the bundled choice) or unavailable.
  string selected_by = 5;
  // The person's explicit choice; empty for automatic.
  string choice = 6;
  // Every model registered for the job, in display order.
  repeated string models = 7;
  // A model more accurate than the planned one that this computer can run
  // and hold in memory, when there is one: offered, never switched to.
  string more_accurate = 8;
}

message ListModelsResponse {
  repeated ModelV1 models = 1;
  repeated ModelJobV1 jobs = 2;
  // Where weights are installed, and the free space on that volume.
  string install_path = 3;
  uint64 available_bytes = 4;
  bool available_known = 5;
  // Physical memory, and the share an analysis may use as the scheduler
  // counts it. Each model's fit is computed against these. Zero is unknown.
  uint64 memory_total_bytes = 6;
  uint64 memory_budget_bytes = 7;
  // What completing the recommended set would download on this device.
  uint64 recommended_missing_bytes = 8;
  repeated string recommended_missing = 9;
}

// Queue downloads. A model already queued or downloading is left alone.
message DownloadModelsRequest { repeated string names = 1; }
message CancelModelDownloadRequest { string name = 1; }
// Delete a model's installed weights. Refused while an unfinished analysis
// task uses it; a choice naming it returns to automatic.
message RemoveModelRequest { string name = 1; }
// Hash every installed file against its pin. A file that no longer matches
// is removed, so the next download repairs exactly that file.
message VerifyModelRequest { string name = 1; }
message SetModelChoiceRequest {
  string capability = 1;
  // Empty returns the job to automatic selection.
  string model = 2;
}

// Pinning a person's own model. Inspecting reads the repository — a network
// operation — and answers with what would be pinned; adding pins it. Only
// jobs whose worker loads whatever it is handed take one: whisper.cpp
// transcription and MLX editorial models.
message InspectHubModelRequest {
  // owner/name on Hugging Face.
  string repo = 1;
  // Commit, branch or tag. The answer names the commit it resolved to, and
  // only that commit is ever pinned.
  string revision = 2;
  string capability = 3;
}
message HubModelFileV1 {
  string path = 1;
  uint64 bytes = 2;
  // For a whisper.cpp weight choice: the registry name and title pinning this
  // file would use, unique among the models already registered.
  string suggested_name = 3;
  string suggested_title = 4;
}
message InspectHubModelResponse {
  string repo = 1;
  string commit = 2;
  string capability = 3;
  // The licence as the repository declares it, and the SPDX identifier it
  // maps to when that is one ClipMill's policy permits.
  string license = 4;
  string license_spdx = 5;
  bool license_allowed = 6;
  // Why this cannot be pinned, when it cannot. Empty when it can.
  string problem = 7;
  // whisper.cpp: the GGML files to choose from; exactly one is pinned.
  repeated HubModelFileV1 weight_choices = 8;
  // MLX: every file the model directory needs, pinned together.
  repeated HubModelFileV1 files = 9;
  string suggested_name = 10;
  string suggested_title = 11;
}
message AddCustomModelRequest {
  string repo = 1;
  // The commit an inspection resolved to.
  string commit = 2;
  string capability = 3;
  // whisper.cpp: the one GGML file to pin. Ignored for MLX.
  string weights_file = 4;
  // Registry name; lowercase words joined by hyphens or dots.
  string name = 5;
  string title = 6;
}
// Remove a model the person pinned: its weights and its manifest. Bundled
// models cannot be forgotten, only their weights removed.
message ForgetModelRequest { string name = 1; }

// ---- Storage clean-up ----

message CleanStorageRequest {
  // unused_files: generated files nothing references, removed now instead of
  //   after the retention period. Every reference is re-verified first.
  // temporary: scratch left behind by stopped work and interrupted downloads.
  // backups: database backups other than the newest.
  string action = 1;
}
message CleanStorageResponse {
  uint64 freed_bytes = 1;
  uint64 removed_items = 2;
  // Measured again after the clean-up.
  GetStorageStatsResponse storage = 3;
}
