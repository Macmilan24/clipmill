// The worker protocol (book ch. 9): workers advertise a signed capability
// descriptor at startup, take leased tasks, stream heartbeats with
// structured progress (never synthetic percentages, ch. 10), and finish
// with a completion or a machine-readable decline. Workers are disposable;
// the daemon owns truth.
syntax = "proto3";

package clipmill.worker.v1;

import "clipmill/shm/v1/shm.proto";

// Advertised once at startup. The signature field exists from day one
// (decision R5): Phase 0 verifies against a locally generated dev key; the
// signed model/worker registry arrives in Phase 4 without a protocol change.
message CapabilityDescriptor {
  string worker_id = 1;
  // Worker family, e.g. "echo", "asr", "vision". One locked venv per family.
  string family = 2;
  // Capability names this worker can serve, e.g. "echo", "asr", "embed-text".
  repeated string capabilities = 3;
  // Worker protocol version, e.g. "1.0". The daemon serves the current and
  // the previous minor.
  string protocol_version = 4;
  // The runtime this worker executes on, which decides what hardware it
  // needs: "cpu" and "onnx-cpu" need none, "mlx" and "coreml" need Metal,
  // "cuda" needs CUDA. The daemon admits against the *verified* device
  // profile, so a worker cannot claim hardware the machine never measured.
  string backend = 5;
  uint64 max_memory_bytes = 6;
  // Ed25519 public key and signature over the descriptor fields.
  bytes public_key = 7;
  bytes signature = 8;
  // Real declared resources (protocol 1.2). A worker that under-declares
  // starves; one that over-declares is capacity-rejected rather than
  // admitted into a machine that cannot hold it.
  uint32 cpu_threads = 9;
  // Dedicated video memory the worker may use. Zero on unified-memory
  // machines, where the budget is max_memory_bytes and counting both would
  // reserve the same bytes twice.
  uint64 vram_bytes = 10;
}

// A leased unit of work. Payload is opaque here; its shape is the leased
// stage's own versioned contract.
message TaskLease {
  string task_id = 1;
  string lease_id = 2;
  // Task kind, e.g. "echo", "probe", "asr".
  string kind = 3;
  bytes payload = 4;
  uint64 heartbeat_interval_ms = 5;
  uint64 lease_ttl_ms = 6;
  // The daemon owns this private CAS staging area. Workers may create only
  // the relative paths they later declare in Complete.staged_outputs.
  string staging_id = 7;
  string staging_dir = 8;
  repeated string input_artifact_ids = 9;
  clipmill.shm.v1.BufferDescriptor shared_buffer = 10;
  string output_kind = 11;
  uint32 attempt = 12;
}

// Structured progress: real work units with a bounded estimate. A total of
// zero means the total is not yet known.
message ProgressUnits {
  // The unit being counted, e.g. "audio_seconds", "frames_decoded".
  string unit = 1;
  uint64 done = 2;
  uint64 total = 3;
}

message Heartbeat {
  string lease_id = 1;
  ProgressUnits progress = 2;
}

// A worker may decline a task before touching media, with a reason the
// scheduler can act on.
message Decline {
  string task_id = 1;
  DeclineReason reason = 2;
  string detail = 3;
}

enum DeclineReason {
  DECLINE_REASON_UNSPECIFIED = 0;
  DECLINE_REASON_UNSUPPORTED_KIND = 1;
  DECLINE_REASON_VERSION_SKEW = 2;
  DECLINE_REASON_RESOURCE_EXHAUSTED = 3;
  DECLINE_REASON_POLICY = 4;
}

message Complete {
  string lease_id = 1;
  TaskOutcome outcome = 2;
  // Content addresses of artifacts staged and hash-verified by the daemon.
  repeated string artifact_ids = 3;
  // Machine-readable failure classification for the retry taxonomy (ch. 10).
  FailureClass failure_class = 4;
  string detail = 5;
  // Workers declare staged paths and observations; the daemon independently
  // validates, hashes, commits, assigns artifact IDs, and roots the result.
  repeated StagedOutput staged_outputs = 6;
}

message StagedOutput {
  string relative_path = 1;
  uint64 byte_size = 2;
  string sha256 = 3;
}

// The daemon sends a fresh nonce for every connection. Registration
// signatures cover this challenge and a canonical capability descriptor,
// preventing descriptor replay.
message RegistrationChallenge {
  bytes nonce = 1;
  repeated string supported_protocol_versions = 2;
  uint64 issued_unix_millis = 3;
}

message RegisterWorker {
  CapabilityDescriptor descriptor = 1;
}

message RegistrationAck {
  bool accepted = 1;
  string session_id = 2;
  string detail = 3;
}

message WorkRequest {
  uint64 max_wait_ms = 1;
}

message NoWork {
  uint64 retry_after_ms = 1;
}

message LeaseAcceptance {
  string lease_id = 1;
  bool accepted = 2;
  DeclineReason reason = 3;
  string detail = 4;
}

message HeartbeatAck {
  string lease_id = 1;
  bool accepted = 2;
  bool cancelled = 3;
  uint64 expires_unix_millis = 4;
}

message CancelLease {
  string lease_id = 1;
  string reason = 2;
}

message CompletionAck {
  string lease_id = 1;
  bool accepted = 2;
  repeated string artifact_ids = 3;
  string detail = 4;
}

message ProtocolError {
  string code = 1;
  string detail = 2;
}

message WorkerRequest {
  oneof body {
    RegisterWorker register = 1;
    WorkRequest work_request = 2;
    LeaseAcceptance lease_acceptance = 3;
    Heartbeat heartbeat = 4;
    Complete complete = 5;
    Decline decline = 6;
  }
}

message WorkerResponse {
  oneof body {
    RegistrationChallenge challenge = 1;
    RegistrationAck registration_ack = 2;
    TaskLease task_lease = 3;
    NoWork no_work = 4;
    HeartbeatAck heartbeat_ack = 5;
    CancelLease cancel = 6;
    CompletionAck completion_ack = 7;
    ProtocolError error = 8;
  }
}

enum TaskOutcome {
  TASK_OUTCOME_UNSPECIFIED = 0;
  TASK_OUTCOME_SUCCEEDED = 1;
  TASK_OUTCOME_RETRYABLE = 2;
  TASK_OUTCOME_FAILED = 3;
  TASK_OUTCOME_CANCELLED = 4;
}

enum FailureClass {
  FAILURE_CLASS_UNSPECIFIED = 0;
  // Transient resource loss: retry with backoff.
  FAILURE_CLASS_TRANSIENT = 1;
  // Deterministic input failure: retrying a poison file is a loop.
  FAILURE_CLASS_DETERMINISTIC = 2;
  // Corrupt model: quarantine the model, not the task.
  FAILURE_CLASS_CORRUPT_MODEL = 3;
  // Network unavailable: park until the broker reports reachability.
  FAILURE_CLASS_NETWORK = 4;
}
