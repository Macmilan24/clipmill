// Bulk data never rides the message channel (book ch. 9): the producer
// seals an Arrow-compatible buffer in shared memory and sends this
// descriptor. The consumer validates every dimension before mapping.
syntax = "proto3";

package clipmill.shm.v1;

import "clipmill/time/v1/time.proto";

message BufferDescriptor {
  // Platform shared-memory identifier (POSIX shm name / Windows section).
  string shm_name = 1;
  repeated uint64 shape = 2;
  DataType dtype = 3;
  // Color space for image buffers, e.g. "bt709"; empty otherwise.
  string colorspace = 4;
  // Timebase governing any time axis in the buffer.
  clipmill.time.v1.Timebase timebase = 5;
  uint64 byte_len = 6;
  // Hash of the sealed bytes; consumers verify before trusting.
  string sha256 = 7;
  // The task lease this buffer belongs to; unmapped when the lease ends.
  string lease_id = 8;
  // Linux transfers a sealed memfd through SCM_RIGHTS. macOS opens a private
  // POSIX shm name read-only and the daemon unlinks it after map acknowledgement.
  TransportType transport_type = 9;
  // One-use, unguessable bearer token bound to lease_id.
  string handle_token = 10;
}

message MapRequest {
  string lease_id = 1;
  string handle_token = 2;
}

message MapAcknowledgement {
  string lease_id = 1;
  string handle_token = 2;
  bool mapped = 3;
  string detail = 4;
}

enum TransportType {
  TRANSPORT_TYPE_UNSPECIFIED = 0;
  TRANSPORT_TYPE_SCM_RIGHTS_MEMFD = 1;
  TRANSPORT_TYPE_POSIX_SHM = 2;
}

enum DataType {
  DATA_TYPE_UNSPECIFIED = 0;
  DATA_TYPE_U8 = 1;
  DATA_TYPE_I16 = 2;
  DATA_TYPE_I32 = 3;
  DATA_TYPE_F16 = 4;
  DATA_TYPE_F32 = 5;
}
